nt-size="13"><tspan x="1580" dy="0">16. Soft-deleted notification</tspan></text><line x1="1430" y1="2552" x2="1130" y2="2552" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2542" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">17. Soft-deleted notification</tspan></text><line x1="1130" y1="2640" x2="850" y2="2640" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2613" text-anchor="middle" font-size="13"><tspan x="990" dy="0">18. { message:</tspan><tspan x="990" dy="17">NotificationMessage.DELETED }</tspan></text><line x1="850" y1="2728" x2="590" y2="2728" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2718" text-anchor="middle" font-size="13"><tspan x="720" dy="0">19. Return controller result</tspan></text><line x1="590" y1="2816" x2="330" y2="2816" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2789" text-anchor="middle" font-size="13"><tspan x="460" dy="0">20. 200 OK: { message:</tspan><tspan x="460" dy="17">NotificationMessage.DELETED }</tspan></text><line x1="330" y1="2904" x2="90" y2="2904" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2877" text-anchor="middle" font-size="13"><tspan x="210" dy="0">21. Invalidate notifications</tspan><tspan x="210" dy="17">query; refetch active list</tspan></text></g></svg>
