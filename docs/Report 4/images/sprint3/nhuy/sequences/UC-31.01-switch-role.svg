<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="3651" viewBox="0 0 2110 3651"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-31.01 — Switch Role</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Authenticated User</tspan></text><line x1="90" y1="280" x2="90" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:AuthView</tspan></text><line x1="330" y1="225" x2="330" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="3219" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:AuthRoute</tspan></text><line x1="590" y1="225" x2="590" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="3207" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:AuthController</tspan></text><line x1="850" y1="225" x2="850" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="3195" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:AuthService</tspan></text><line x1="1130" y1="225" x2="1130" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="3183" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:AuthRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="3171" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="3159" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="3611" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="3147" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1034" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1062h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1053" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1056" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1913" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1941h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1932" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1935" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[assignment missing]</tspan></text><rect x="35" y="2898" width="2040" height="95" fill="none" stroke="#111"/><path d="M35 2926h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2917" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="2920" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">TokenService.signAccessToken({ userId, roleId: role.id, roleName: role.name, sessionId }): sign JWT for the existing session</tspan></text><rect x="35" y="3293" width="2040" height="100" fill="none" stroke="#111"/><path d="M35 3321h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3312" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="3315" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">Next.js /api/auth proxy sets accessToken cookie and returns { roleName: body.role }; on initial backend 401, refresh tokens and retry once if refresh succeeds</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="273" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Choose an assigned CLIENT or</tspan><tspan x="210" dy="17">FREELANCER role</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST /auth/switch-role</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. switchRole(userId, sessionId,</tspan><tspan x="720" dy="17">body)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1112" x2="330" y2="1112" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1102" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1200" x2="90" y2="1200" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1190" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1320" x2="1130" y2="1320" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1310" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. switchRole(userId, sessionId, body)</tspan></text><line x1="1130" y1="1408" x2="1430" y2="1408" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1381" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. switchPrimaryRole(userId, body.role):</tspan><tspan x="1280" dy="17">lookup assignment</tspan></text><line x1="1430" y1="1496" x2="1730" y2="1496" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1469" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. userRole.findFirst(userId; role.name;</tspan><tspan x="1580" dy="17">role.deletedAt null; include role)</tspan></text><line x1="1730" y1="1585" x2="1990" y2="1585" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1558" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT current user assignment to</tspan><tspan x="1860" dy="17">active target role</tspan></text><line x1="1990" y1="1673" x2="1730" y2="1673" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1663" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Assignment or null</tspan></text><line x1="1730" y1="1761" x2="1430" y2="1761" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1751" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Assignment or null</tspan></text><line x1="1430" y1="1849" x2="1130" y2="1849" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1839" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Assignment or null</tspan></text><line x1="1130" y1="1991" x2="850" y2="1991" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1981" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 RoleNotFoundException</tspan></text><line x1="850" y1="2079" x2="590" y2="2079" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2069" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2167" x2="330" y2="2167" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2157" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2255" x2="90" y2="2255" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2245" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2375" x2="1430" y2="2375" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2348" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">12. switchPrimaryRole: persist primary</tspan><tspan x="1280" dy="17">role</tspan></text><line x1="1430" y1="2463" x2="1730" y2="2463" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2419" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">13. $transaction:</tspan><tspan x="1580" dy="17">userRole.updateMany(isPrimary true -&gt;</tspan><tspan x="1580" dy="17">false); userRole.update(target -&gt; true)</tspan></text><line x1="1730" y1="2569" x2="1990" y2="2569" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2525" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">14. CLEAR existing primary</tspan><tspan x="1860" dy="17">assignment; SET target assignment</tspan><tspan x="1860" dy="17">primary; COMMIT</tspan></text><line x1="1990" y1="2658" x2="1730" y2="2658" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="2648" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. Assigned role</tspan></text><line x1="1730" y1="2746" x2="1430" y2="2746" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="2736" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">16. Assigned role</tspan></text><line x1="1430" y1="2834" x2="1130" y2="2834" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2824" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">17. Assigned role</tspan></text><line x1="1130" y1="3053" x2="850" y2="3053" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3043" text-anchor="middle" font-size="13"><tspan x="990" dy="0">18. { accessToken }</tspan></text><line x1="850" y1="3141" x2="590" y2="3141" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3131" text-anchor="middle" font-size="13"><tspan x="720" dy="0">19. Return role response DTO</tspan></text><line x1="590" y1="3229" x2="330" y2="3229" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3202" text-anchor="middle" font-size="13"><tspan x="460" dy="0">20. 201 Created: { accessToken }</tspan><tspan x="460" dy="17">(NestJS response)</tspan></text><line x1="330" y1="3453" x2="90" y2="3453" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3426" text-anchor="middle" font-size="13"><tspan x="210" dy="0">21. Use new role and navigate to</tspan><tspan x="210" dy="17">its workspace</tspan></text></g></svg>
