<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1182" viewBox="0 0 2600 1182"><title>Notification Management class diagram</title><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#30343b" stroke-width="1.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d232b}.frame{fill:#fff;stroke:#30343b;stroke-width:2}.head{font-size:18px;font-weight:bold}.stereo{font-size:13px;font-style:italic}.body{font-size:15px}.edge{fill:none;stroke:#414851;stroke-width:1.7}.label{font-size:12px;text-anchor:middle}</style></defs><rect width="100%" height="100%" fill="#fff"/><path class="edge" d="M 460 199.5 L 488 199.5 L 512 199.5 L 512 174.5 L 540 174.5" marker-end="url(#arrow)"/><rect x="481.5" y="181.5" width="61" height="19" fill="white"/><text class="label" x="512" y="195.5">maps to</text><path class="edge" d="M 970 174.5 L 998 174.5 L 1022 174.5 L 1022 174.5 L 1050 174.5" marker-end="url(#arrow)"/><rect x="992" y="156.5" width="60" height="19" fill="white"/><text class="label" x="1022" y="170.5">calls</text><path class="edge" d="M 1530 174.5 L 1558 174.5 L 1582 174.5 L 1582 185 L 1610 185" marker-end="url(#arrow)"/><rect x="1552" y="156.5" width="60" height="19" fill="white"/><text class="label" x="1582" y="170.5">calls</text><path class="edge" d="M 2090 242 L 2115 242 L 2115 305 L 2169 305 L 2169 369 L 270 369 L 270 404" marker-end="url(#arrow)"/><rect x="2139" y="287" width="60" height="19" fill="white"/><text class="label" x="2169" y="301">uses</text><path class="edge" d="M 460 265.20000000000005 L 485 265.20000000000005 L 485 334 L 2182 334 L 2182 369 L 790 369 L 790 404" marker-end="url(#arrow)"/><rect x="2106" y="316" width="152" height="19" fill="white"/><text class="label" x="2182" y="330">authenticated routes</text><path class="edge" d="M 460 265.20000000000005 L 485 265.20000000000005 L 485 334 L 2195 334 L 2195 369 L 1310 369 L 1310 404" marker-end="url(#arrow)"/><rect x="2119" y="316" width="152" height="19" fill="white"/><text class="label" x="2195" y="330">authenticated routes</text><path class="edge" d="M 970 225.20000000000002 L 995 225.20000000000002 L 995 284 L 2208 284 L 2208 702 L 270 702 L 270 737" marker-end="url(#arrow)"/><rect x="2174" y="266" width="68" height="19" fill="white"/><text class="label" x="2208" y="280">response</text><path class="edge" d="M 970 225.20000000000002 L 995 225.20000000000002 L 995 284 L 2221 284 L 2221 702 L 790 702 L 790 737" marker-end="url(#arrow)"/><rect x="2187" y="266" width="68" height="19" fill="white"/><text class="label" x="2221" y="280">response</text><path class="edge" d="M 510 495.2 L 535 495.2 L 535 543 L 2234 543 L 2234 702 L 1310 702 L 1310 737" marker-end="url(#arrow)"/><rect x="2200" y="525" width="68" height="19" fill="white"/><text class="label" x="2234" y="539">persists</text><path class="edge" d="M 1550 540 L 1575 540 L 1575 599 L 2247 599 L 2247 369 L 1830 369 L 1830 404" marker-end="url(#arrow)"/><rect x="2195.5" y="581" width="103" height="19" fill="white"/><text class="label" x="2247" y="595">checks access</text><path class="edge" d="M 2070 523.2 L 2095 523.2 L 2095 578 L 2260 578 L 2260 369 L 270 369 L 270 404" marker-end="url(#arrow)"/><rect x="2205" y="560" width="110" height="19" fill="white"/><text class="label" x="2260" y="574">queries grants</text><path class="edge" d="M 1550 945.8 L 1575 945.8 L 1575 1023 L 2273 1023 L 2273 702 L 1830 702 L 1830 737" marker-end="url(#arrow)"/><rect x="2243" y="1005" width="60" height="19" fill="white"/><text class="label" x="2273" y="1019">type</text><rect class="frame" x="30" y="90" width="430" height="219"/><text class="stereo" text-anchor="middle" x="245" y="110">&lt;&lt;route&gt;&gt;</text><text class="head" text-anchor="middle" x="245" y="133">NotificationManagementRoutes</text><text class="body" x="42" y="167">+ GET /notifications [AuthGuard, PermissionGuard]</text><text class="body" x="42" y="188">+ PATCH /notifications/read-all [AuthGuard,</text><text class="body" x="42" y="209">PermissionGuard]</text><text class="body" x="42" y="230">+ PATCH /notifications/:id/read [AuthGuard,</text><text class="body" x="42" y="251">PermissionGuard]</text><text class="body" x="42" y="272">+ DELETE /notifications/:id [AuthGuard,</text><text class="body" x="42" y="293">PermissionGuard]</text><rect class="frame" x="540" y="90" width="430" height="169"/><text class="head" text-anchor="middle" x="755" y="115">NotificationController</text><text class="body" x="552" y="145">- service: NotificationService</text><path d="M540 161H970" class="edge"/><text class="body" x="552" y="180">+ getAll(userId: number)</text><text class="body" x="552" y="201">+ markAllRead(userId: number)</text><text class="body" x="552" y="222">+ markRead(userId: number, id: number)</text><text class="body" x="552" y="243">+ delete(userId: number, id: number)</text><rect class="frame" x="1050" y="90" width="480" height="169"/><text class="head" text-anchor="middle" x="1290" y="115">NotificationService</text><text class="body" x="1062" y="145">- repository: NotificationRepository</text><path d="M1050 161H1530" class="edge"/><text class="body" x="1062" y="180">+ getAll(userId: number)</text><text class="body" x="1062" y="201">+ markRead(userId: number, notificationId: number)</text><text class="body" x="1062" y="222">+ markAllRead(userId: number)</text><text class="body" x="1062" y="243">+ delete(userId: number, notificationId: number)</text><rect class="frame" x="1610" y="90" width="480" height="190"/><text class="head" text-anchor="middle" x="1850" y="115">NotificationRepository</text><text class="body" x="1622" y="145">- prisma: PrismaService</text><path d="M1610 161H2090" class="edge"/><text class="body" x="1622" y="180">+ findAll(userId: number)</text><text class="body" x="1622" y="201">+ findById(userId: number, notificationId: number)</text><text class="body" x="1622" y="222">+ markRead(notificationId: number)</text><text class="body" x="1622" y="243">+ markAllRead(userId: number)</text><text class="body" x="1622" y="264">+ softDelete(notificationId: number)</text><rect class="frame" x="30" y="404" width="480" height="114"/><text class="stereo" text-anchor="middle" x="270" y="424">&lt;&lt;infrastructure&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="447">PrismaService</text><text class="body" x="42" y="481">extends PrismaClient</text><text class="body" x="42" y="502">Generated model delegates and $transaction</text><rect class="frame" x="550" y="404" width="480" height="233"/><text class="stereo" text-anchor="middle" x="790" y="424">&lt;&lt;guard&gt;&gt;</text><text class="head" text-anchor="middle" x="790" y="447">AuthGuard</text><text class="body" x="562" y="481">- tokenService: TokenService</text><text class="body" x="562" y="502">- prisma: PrismaService</text><text class="body" x="562" y="523">- reflector: Reflector</text><path d="M550 539H1030" class="edge"/><text class="body" x="562" y="558">+ canActivate(context: ExecutionContext):</text><text class="body" x="562" y="579">Promise&amp;lt;boolean&amp;gt;</text><text class="body" x="562" y="600">- extractTokenFromHeader(request: Request): string |</text><text class="body" x="562" y="621">undefined</text><rect class="frame" x="1070" y="404" width="480" height="170"/><text class="stereo" text-anchor="middle" x="1310" y="424">&lt;&lt;guard&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="447">PermissionGuard</text><text class="body" x="1082" y="481">- reflector: Reflector</text><text class="body" x="1082" y="502">- sharedPermissionRepository: SharedPermissionRepository</text><path d="M1070 518H1550" class="edge"/><text class="body" x="1082" y="537">+ canActivate(context: ExecutionContext):</text><text class="body" x="1082" y="558">Promise&amp;lt;boolean&amp;gt;</text><rect class="frame" x="1590" y="404" width="480" height="149"/><text class="stereo" text-anchor="middle" x="1830" y="424">&lt;&lt;repository&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="447">SharedPermissionRepository</text><text class="body" x="1602" y="481">- prisma: PrismaService</text><path d="M1590 497H2070" class="edge"/><text class="body" x="1602" y="516">+ roleHasPermission(roleId: number, method: string,</text><text class="body" x="1602" y="537">path: string)</text><rect class="frame" x="30" y="737" width="480" height="93"/><text class="stereo" text-anchor="middle" x="270" y="757">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="780">NotificationListDto</text><text class="body" x="42" y="814">Array response: NotificationListSchema</text><rect class="frame" x="550" y="737" width="480" height="240"/><text class="stereo" text-anchor="middle" x="790" y="757">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="790" y="780">NotificationDto</text><text class="body" x="562" y="814">+ id: number</text><text class="body" x="562" y="835">+ userId: number</text><text class="body" x="562" y="856">+ type: object (see DTO schema)</text><text class="body" x="562" y="877">+ title: string | null</text><text class="body" x="562" y="898">+ message: string | null</text><text class="body" x="562" y="919">+ data: unknown</text><text class="body" x="562" y="940">+ isRead: boolean</text><text class="body" x="562" y="961">+ createdAt: string | Date</text><rect class="frame" x="1070" y="737" width="480" height="261"/><text class="stereo" text-anchor="middle" x="1310" y="757">&lt;&lt;schema&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="780">Notification</text><text class="body" x="1082" y="814">+ id: Int</text><text class="body" x="1082" y="835">+ userId: Int</text><text class="body" x="1082" y="856">+ type: NotificationType</text><text class="body" x="1082" y="877">+ title: String?</text><text class="body" x="1082" y="898">+ message: String?</text><text class="body" x="1082" y="919">+ data: Json?</text><text class="body" x="1082" y="940">+ isRead: Boolean</text><text class="body" x="1082" y="961">+ createdAt: DateTime</text><text class="body" x="1082" y="982">+ deletedAt: DateTime?</text><rect class="frame" x="1590" y="737" width="480" height="345"/><text class="stereo" text-anchor="middle" x="1830" y="757">&lt;&lt;enum&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="780">NotificationType</text><text class="body" x="1602" y="814">NEW_FOLLOWER</text><text class="body" x="1602" y="835">JOB_ALERT</text><text class="body" x="1602" y="856">PROPOSAL_NEW</text><text class="body" x="1602" y="877">PROPOSAL_ACCEPTED</text><text class="body" x="1602" y="898">CONTRACT_CREATED</text><text class="body" x="1602" y="919">PAYMENT_RELEASED</text><text class="body" x="1602" y="940">DISPUTE_OPENED</text><text class="body" x="1602" y="961">REVIEW_RECEIVED</text><text class="body" x="1602" y="982">REVIEW_RESPONSE_RECEIVED</text><text class="body" x="1602" y="1003">SYSTEM_ANNOUNCEMENT</text><text class="body" x="1602" y="1024">MESSAGE_NEW</text><text class="body" x="1602" y="1045">MILESTONE_COMPLETED</text><text class="body" x="1602" y="1066">TASK_OVERDUE</text></svg>