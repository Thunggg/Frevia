" y1="3255" x2="330" y2="3255" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3245" text-anchor="middle" font-size="13"><tspan x="460" dy="0">21. 200 OK: Deleted FreelancerSkill</tspan></text><line x1="330" y1="3343" x2="90" y2="3343" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3316" text-anchor="middle" font-size="13"><tspan x="210" dy="0">22. Remove skill from local list;</tspan><tspan x="210" dy="17">show success</tspan></text></g></svg>
