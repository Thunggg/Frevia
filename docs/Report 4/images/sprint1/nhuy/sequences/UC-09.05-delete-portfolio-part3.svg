sion / role permission]</tspan></text><rect x="25" y="1253" width="2060" height="120" fill="none" stroke="#555"/><text x="70" y="1280" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="1280" text-anchor="start" font-size="20"><tspan x="120" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="25" y="2408.5" width="2060" height="603" fill="none" stroke="#555"/><text x="70" y="2435.5" text-anchor="middle" font-size="22"><tspan x="70" dy="0">break</tspan></text><text x="120" y="2435.5" text-anchor="start" font-size="20"><tspan x="120" dy="0">[portfolio not found or soft-deleted]</tspan></text><rect x="25" y="3065.5" width="2060" height="603" fill="none" stroke="#555"/><text x="70" y="3092.5" text-anchor="middle" font-size="22"><tspan x="70" dy="0">break</tspan></text><text x="120" y="3092.5" text-anchor="start" font-size="20"><tspan x="120" dy="0">[stored owner userId != currentUserId]</tspan></text><rect x="25" y="5073.5" width="2060" height="129" fill="none" stroke="#555"/><text x="70" y="5100.5" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="5100.5" text-anchor="start" font-size="20"><tspan x="120" dy="0">On non-HttpException in PortfolioService: 500 UnableToDeletePortfolioException; existing HttpException is rethrown</tspan></text><path d="M90 326H330" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="210" y="286" text-anchor="middle" font-size="24"><tspan x="210" dy="0">1. Choose portfolio;</tspan><tspan x="210" dy="28">confirm Delete</tspan></text><path d="M330 458H590" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="460" y="390" text-anchor="middle" font-size="24"><tspan x="460" dy="0">2. DELETE</tspan><tspan x="460" dy="28">/profiles/portfolios/</tspan><tspan x="460" dy="28">:id</tspan></text><path d="M590 590H850" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="720" y="522" text-anchor="middle" font-