><tspan x="1580" dy="0">13.</tspan><tspan x="1580" dy="28">freelancerProfile.findUni</tspan><tspan x="1580" dy="28">que(profileId); fallback</tspan><tspan x="1580" dy="28">findFirst(userId)</tspan></text><path d="M1730 2598H1990" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2530" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">14. SELECT</tspan><tspan x="1860" dy="28">FreelancerProfile; if</tspan><tspan x="1860" dy="28">absent return []</tspan></text><path d="M1990 2730H1730" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1860" y="2690" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">15. FreelancerProfile</tspan><tspan x="1860" dy="28">or null</tspan></text><path d="M1730 2862H1430" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1580" y="2822" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">16. FreelancerProfile or</tspan><tspan x="1580" dy="28">null</tspan></text><path d="M1430 2994H1130" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1280" y="2954" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">17. FreelancerProfile or</tspan><tspan x="1280" dy="28">null</tspan></text><path d="M1130 3207H1430" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3139" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">18. Continue</tspan><tspan x="1280" dy="28">findSkillsByProfileId(pro</tspan><tspan x="1280" dy="28">fileId)</tspan></text><path d="M1430 3339H1730" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3243" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">19.</tspan><tspan x="1580" dy="28">freelancerSkill.findMany(</tspan><tspan x="1580" dy="28">include skill; orderBy</tspan><tspan x="1580" dy="28">skill.name asc)</tspan></text><path d="M1730 3499H1990" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3375" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">20. SELECT skills</tspan><tspan x="1860" dy="28">WHERE</tspan><tspan x="1860" dy="28">freelancerProfileId</tspan><tspan x="1860" dy="28">AND skill.deletedAt</tspan><tspan x="1860" dy="28">IS NULL</tspan></text><path d="M1990 3632.5H1730" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1860" y="3620.5" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">21. FreelancerSkill[]</tspan></text><path d="M1730 3764.5H1430" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1580" y="3752.5" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">22. FreelancerSkill[]</tspan></text><path d="M1430 3896.5H1130" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1280" y="3884.5" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">23. FreelancerSkill[]</tspan></text><path d="M1130 4076.5H850" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="990" y="4036.5" text-anchor="middle" font-size="24"><tspan x="990" dy="0">24. FreelancerSkill[]</tspan><tspan x="990" dy="28">(possibly empty)</tspan></text><path d="M850 4208.5H590" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="720" y="4168.5" text-anchor="middle" font-size="24"><tspan x="720" dy="0">25. Return controller</tspan><tspan x="720" dy="28">result</tspan></text><path d="M590 4340.5H330" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="460" y="4272.5" text-anchor="middle" font-size="24"><tspan x="460" dy="0">26. 200 OK:</tspan><tspan x="460" dy="28">FreelancerSkill[]</tspan><tspan x="460" dy="28">(possibly empty)</tspan></text><path d="M330 4472.5H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="4432.5" text-anchor="middle" font-size="24"><tspan x="210" dy="0">27. Display skill</tspan><tspan x="210" dy="28">list or empty state</tspan></text></g></g></g></svg>