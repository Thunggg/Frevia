t-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2812" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[file missing]</tspan></text><rect x="35" y="3228" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 3256h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3247" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="3250" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[MIME != application/pdf OR first bytes != %PDF- OR size &gt;10 MB]</tspan></text><rect x="35" y="3720" width="2040" height="85" fill="none" stroke="#111"/><path d="M35 3748h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3739" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="3742" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">CloudinaryService.uploadFile(file, frevia/cvs/userId): secure_url and public_id</tspan></text><rect x="35" y="3899" width="2040" height="85" fill="none" stroke="#111"/><path d="M35 3927h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3918" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="3921" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">mkdir/writeFile uploads/cvs/userId/UUID.pdf; cvUrl=local://path; cvPublicId=null</tspan></text><rect x="35" y="3666" width="2040" height="350" fill="none" stroke="#111"/><path d="M35 3694h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3685" text-anchor="middle" font-size="13"><tspan x="68" dy="0">alt</tspan></text><text x="1090" y="3688" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[Cloudinary configured]</tspan></text><rect x="35" y="4652" width="2040" height="90" fill="none" stroke="#111"/><path d="M35 4680h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="4671" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="4674" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">After new metadata saved: Cloudinary.deleteFile(old publicId), else resolve safe local path and unlink(old file). Cleanup errors are ignored.</tspan></text><rect x="35" y="4598" width="2040" height="176" fill="none" stroke="#111"/><path d="M35 4626h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="4617" text-anchor="middle" font-size="13"><tspan x="68" dy="0">opt</tspan></text><text x="1090" y="4620" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[previous CV has cvPublicId OR local:// URL]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Choose PDF CV; Upload</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST /profiles/:id/cv</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. uploadCv(profileId, currentUserId,</tspan><tspan x="720" dy="17">file)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1112" x2="330" y2="1112" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1102" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1200" x2="90" y2="1200" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1190" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1320" x2="1130" y2="1320" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1293" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. uploadCv(profileId, currentUserId,</tspan><tspan x="990" dy="17">file)</tspan></text><line x1="1130" y1="1408" x2="1430" y2="1408" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1381" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. getOwnedFreelancerProfile:</tspan><tspan x="1280" dy="17">findFreelancerProfileById(profileId)</tspan></text><line x1="1430" y1="1496" x2="1730" y2="1496" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1452" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(id); fallback</tspan><tspan x="1580" dy="17">findFirst(userId); include</tspan><tspan x="1580" dy="17">freelancerProfile and roles</tspan></text><line x1="1730" y1="1585" x2="1990" y2="1585" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1558" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT profile of non-deleted user</tspan><tspan x="1860" dy="17">with freelancer data and roles</tspan></text><line x1="1990" y1="1674" x2="1730" y2="1674" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1664" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1762" x2="1430" y2="1762" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1752" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1850" x2="1130" y2="1850" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1840" text-anchor="middle" font-size=