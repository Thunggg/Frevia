vUrl,</tspan><tspan x="1280" dy="17">cvFileName, cvPublicId})</tspan></text><line x1="1430" y1="4164" x2="1730" y2="4164" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="4137" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">16. freelancerProfile.upsert(profileId; CV</tspan><tspan x="1580" dy="17">metadata and cvUploadedAt=new Date())</tspan></text><line x1="1730" y1="4270" x2="1990" y2="4270" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="4243" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">17. UPSERT new CV metadata into</tspan><tspan x="1860" dy="17">FreelancerProfile</tspan></text><line x1="1990" y1="4358" x2="1730" y2="4358" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="4348" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">18. Stored CV metadata</tspan></text><line x1="1730" y1="4446" x2="1430" y2="4446" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="4436" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">19. Stored CV metadata</tspan></text><line x1="1430" y1="4534" x2="1130" y2="4534" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="4524" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">20. Stored CV metadata</tspan></text><path d="M1130 4834h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="4790" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">21. Return local proxy URL</tspan><tspan x="1265" dy="17">/api/backend/profiles/:id/cv/file or</tspan><tspan x="1265" dy="17">remote cvUrl, plus cvFileName</tspan></text><line x1="1130" y1="4923" x2="850" y2="4923" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="4896" text-anchor="middle" font-size="13"><tspan x="990" dy="0">22. CvUploadResponseDto { cvUrl,</tspan><tspan x="990" dy="17">cvFileName }</tspan></text><line x1="850" y1="5011" x2="590" y2="5011" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="5001" text-anchor="middle" font-size="13"><tspan x="720" dy="0">23. Return controller result</tspan></text><line x1="590" y1="5099" x2="330" y2="5099" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="5072" text-anchor="middle" font-size="13"><tspan x="460" dy="0">24. 201 Created: CvUploadResponseDto</tspan><tspan x="460" dy="17">{ cvUrl, cvFileName }</tspan></text><line x1="330" y1="5188" x2="90" y2="5188" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="5161" text-anchor="middle" font-size="13"><tspan x="210" dy="0">25. Display stored CV filename and</tspan><tspan x="210" dy="17">link</tspan></text><line x1="35" y1="3853" x2="2075" y2="3853" stroke="#111" stroke-dasharray="7 5"/><text x="1055" y="3875" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">[else: local filesystem]</tspan></text></g></svg>
