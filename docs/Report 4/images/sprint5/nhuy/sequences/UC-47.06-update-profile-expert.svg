<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="4502" viewBox="0 0 2110 4502"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-47.06 — Update Profile Expert</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Expert</tspan></text><line x1="90" y1="280" x2="90" y2="4462" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ExpertProfileView</tspan></text><line x1="330" y1="225" x2="330" y2="4462" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="4070" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ExpertProfileRoute</tspan></text><line x1="590" y1="225" x2="590" y2="4462" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="4058" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ExpertProfileController</tspan>