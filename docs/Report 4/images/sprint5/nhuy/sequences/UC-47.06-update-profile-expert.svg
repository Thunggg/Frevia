 x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1034" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1062h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1053" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1056" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1913" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1941h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1932" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1935" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user or base profile missing]</tspan></text><rect x="35" y="2351" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2379h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2370" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2373" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user lacks active EXPERT role]</tspan></text><rect x="35" y="3335" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 3363h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3354" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="3357" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[pending expert revision exists]</tspan></text><rect x="35" y="3879" width="2040" height="100" fill="none" stroke="#111"/><path d="M35 3907h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3898" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="3901" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">ProfileRevisionService.submitExpert: ProfileRevisionRepository.findProfileForSnapshot; submit transaction creates/updates PENDING EXPERT revision; live profile unchanged,</tspan><tspan x="1090" dy="17">regardless of strength</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Edit expert profile; Submit</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. PUT /expert-profile/me</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. updateMine(userId, input) -&gt;</tspan><tspan x="720" dy="17">submitUpdate(userId, input)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1112" x2="330" y2="1112" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1102" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1200" x2="90" y2="1200" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1190" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1320" x2="1130" y2="1320" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1293" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. updateMine(userId, input) -&gt;</tspan><tspan x="990" dy="17">submitUpdate(userId, input)</tspan></text><line x1="1130" y1="1408" x2="1430" y2="1408" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1398" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. context: findByUserId(userId)</tspan></text><line x1="1430" y1="1496" x2="1730" y2="1496" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1469" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. user.findFirst(id; deletedAt null;</tspan><tspan x="1580" dy="17">include expert profile and active roles)</tspan></text><line x1="1730" y1="1585" x2="1990" y2="1585" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1558" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active user, expert profile</tspan><tspan x="1860" dy="17">and roles</tspan></text><line x1="1990" y1="1673" x2="1730" y2="1673" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1663" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. User or null</tspan></text><line x1="1730" y1="1761" x2="1430" y2="1761" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1751" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. User or null</tspan></text><line x1="1430" y1="1849" x2="1130" y2="1849" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1839" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. User or null</tspan></text><line x1="1130" y1="1991" x2="850" y2="1991" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1981" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ExpertProfileNotFoundException</tspan></text><line x1="850" y1="2079" x2="590" y2="2079" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2069" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2167" x2="330" y2="2167" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2157" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2255" x2="90" y2="2255" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2245" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2429" x2="850" y2="2429" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2419" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 NotAnExpertAccountException</tspan></text><line x1="850" y1="2517" x2="590" y2="2517" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2507" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2605" x2="330" y2="2605" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2595" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2693" x2="90" y2="2693" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2683" text-anchor="middle" font-size="13"><tspan x="210" dy="0">12.4. Display error message</tspan></text><line x1="1130" y1="2813" x2="1430" y2="2813" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2803" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">13. hasPendingRevision(userId)</tspan></text><line x1="1430" y1="2901" x2="1730" y2="2901" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2874" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">14. profileRevision.findFirst(userId;</tspan><tspan x="1580" dy="17">profileType EXPERT; status PENDING)</tspan></text><line x1="1730" y1="3007" x2="1990" y2="3007" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2997" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. SELECT pending expert revision</tspan></text><line x1="1990" y1="3095" x2="1730" y2="3095" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3085" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. Revision id or null</tspan></text><line x1="1730" y1="3183" x2="1430" y2="3183" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3173" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">17. Revision id or null</tspan></text><line x1="1430" y1="3271" x2="1130" y2="3271" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3261" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">18. Revision id or null</tspan></text><line x1="1130" y1="3413" x2="850" y2="3413" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3386" text-anchor="middle" font-size="13"><tspan x="990" dy="0">19.1. 409</tspan><tspan x="990" dy="17">ExpertProfilePendingRevisionException</tspan></text><line x1="850" y1="3501" x2="590" y2="3501" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3491" text-anchor="middle" font-size="13"><tspan x="720" dy="0">19.2. Propagate HTTP error</tspan></text><line x1="590" y1="3589" x2="330" y2="3589" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3579" text-anchor="middle" font-size="13"><tspan x="460" dy="0">19.3. Return error response</tspan></text><line x1="330" y1="3677" x2="90" y2="3677" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3667" text-anchor="middle" font-size="13"><tspan x="210" dy="0">19.4. Display error message</tspan></text><path d="M1130 3797h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="3736" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">20. sanitize: trim and deduplicate</tspan><tspan x="1265" dy="17">expertise/education/certifications;</tspan><tspan x="1265" dy="17">normalize website;</tspan><tspan x="1265" dy="17">calculateExpertProfileStrength</tspan></text><line x1="1130" y1="4039" x2="850" y2="4039" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="4012" text-anchor="middle" font-size="13"><tspan x="990" dy="0">21. ExpertProfileUpdateResponseDto</tspan><tspan x="990" dy="17">(reviewRequired true)</tspan></text><line x1="850" y1="4127" x2="590" y2="4127" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="4117" text-anchor="middle" font-size="13"><tspan x="720" dy="0">22. Return controller result</tspan></text><line x1="590" y1="4215" x2="330" y2="4215" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="4171" text-anchor="middle" font-size="13"><tspan x="460" dy="0">23. 200 OK:</tspan><tspan x="460" dy="17">ExpertProfileUpdateResponseDto</tspan><tspan x="460" dy="17">(reviewRequired true)</tspan></text><line x1="330" y1="4304" x2="90" y2="4304" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="4277" text-anchor="middle" font-size="13"><tspan x="210" dy="0">24. Show request submitted for</tspan><tspan x="210" dy="17">review</tspan></text></g></svg>
