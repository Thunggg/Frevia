<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="880.5"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker><clipPath id="clip"><rect x="0" y="185" width="2110" height="695.5"/></clipPath></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#111"><text x="1055" y="30" text-anchor="middle" font-size="25"><tspan x="1055" dy="0">UC-47.05 - View Profile Update Request History (4/4)</tspan></text><rect x="10" y="65" width="180" height="105" fill="white" stroke="#111"/><text x="100" y="99" text-anchor="middle" font-size="22"><tspan x="100" dy="0">Administrator</tspan></text><rect x="220" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="330" y="99" text-anchor="middle" font-size="22"><tspan x="330" dy="0">:ProfileRevisionAdmi</tspan><tspan x="330" dy="28">nView</tspan></text><rect x="480" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="590" y="99" text-anchor="middle" font-size="22"><tspan x="590" dy="0">:ProfileRevisionAdmi</tspan><tspan x="590" dy="28">nRoute</tspan></text><rect x="740" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="850" y="99" text-anchor="middle" font-size="22"><tspan x="850" dy="0">:ProfileRevisionAdmi</tspan><tspan x="850" dy="28">nController</tspan></text><rect x="1020" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="1130" y="99" text-anchor="middle" font-size="22"><tspan x="1130" dy="0">:ProfileRevisionServ</tspan><tspan x="1130" dy="28">ice</tspan></text><rect x="1320" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="1430" y="99" text-anchor="middle" font-size="22"><tspan x="1430" dy="0">:ProfileRevisionRepo</tspan><tspan x="1430" dy="28">sitory</tspan></text><rect x="1620" y="65" width="220" height="105" fill="white" stroke="#111"/><text x="1730" y="99" text-anchor="middle" font-size="22"><tspan x="1730" dy="0">:PrismaService</tspan></text><path d="M1965 77v50a25 9 0 0 0 50 0v-50" fill="white" stroke="#111"/><ellipse cx="1990" cy="77" rx="25" ry="9" fill="white" stroke="#111"/><text x="1990" y="161" text-anchor="middle" font-size="22"><tspan x="1990" dy="0">Database</tspan></text><g clip-path="url(#clip)"><g transform="translate(0,-3390)"><line x1="90" y1="220" x2="90" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><line x1="330" y1="220" x2="330" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="325" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="590" y1="220" x2="590" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="585" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="850" y1="220" x2="850" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="845" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="1130" y1="220" x2="1130" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="1125" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="1430" y1="220" x2="1430" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="1425" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="1730" y1="220" x2="1730" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="1725" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><line x1="1990" y1="220" x2="1990" y2="4270.5" stroke="#777" stroke-dasharray="9 7"/><rect x="1985" y="240" width="10" height="4030.5" fill="white" stroke="#111"/><rect x="25" y="797" width="2060" height="120" fill="none" stroke="#555"/><text x="70" y="824" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="824" text-anchor="start" font-size="20"><tspan x="120" dy="0">3.1 Verify jwt</tspan></text><rect x="25" y="971" width="2060" height="339" fill="none" stroke="#555"/><text x="70" y="998" text-anchor="middle" font-size="22"><tspan x="70" dy="0">break</tspan></text><text x="120" y="998" text-anchor="start" font-size="20"><tspan x="120" dy="0">[invalid token / session / role permission]</tspan></text><rect x="25" y="1364" width="2060" height="120" fill="none" stroke="#555"/><text x="70" y="1391" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="1391" text-anchor="start" font-size="20"><tspan x="120" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><path d="M90 354H330" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="210" y="286" text-anchor="middle" font-size="24"><tspan x="210" dy="0">1. Open request</tspan><tspan x="210" dy="28">history; choose ALL,</tspan><tspan x="210" dy="28">APPROVED or REJECTED</tspan></text><path d="M330 542H590" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="460" y="390" text-anchor="middle" font-size="24"><tspan x="460" dy="0">2. GET</tspan><tspan x="460" dy="28">/admin/profile-revisi</tspan><tspan x="460" dy="28">ons?status=APPROVED</tspan><tspan x="460" dy="28">or REJECTED (omit for</tspan><tspan x="460" dy="28">ALL)&amp;page=&amp;limit=&amp;pro</tspan><tspan x="460" dy="28">fileType=&amp;search=</tspan></text><path d="M590 701H850" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="720" y="689" text-anchor="middle" font-size="24"><tspan x="720" dy="0">3. list(filter)</tspan></text><path d="M590 1088H330" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="460" y="1048" text-anchor="middle" font-size="24"><tspan x="460" dy="0">3.1.1. 401 / 403</tspan><tspan x="460" dy="28">error response</tspan></text><path d="M330 1220H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="1152" text-anchor="middle" font-size="24"><tspan x="210" dy="0">3.1.2. Display</tspan><tspan x="210" dy="28">authentication /</tspan><tspan x="210" dy="28">permission error</tspan></text><path d="M850 1574H1130" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1562" text-anchor="middle" font-size="24"><tspan x="990" dy="0">4. list(filter)</tspan></text><path d="M1130 1706H1430" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1638" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">5.</tspan><tspan x="1280" dy="28">syncLowStrengthProfiles(2</tspan><tspan x="1280" dy="28">0)</tspan></text><path d="M1430 1894H1730" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1742" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">6.</tspan><tspan x="1580" dy="28">profile.findMany(strength</tspan><tspan x="1580" dy="28">&lt;20; active non-banned</tspan><tspan x="1580" dy="28">users with primary</tspan><tspan x="1580" dy="28">CLIENT/FREELANCER/EXPERT)</tspan><tspan x="1580" dy="28">; $transaction</tspan></text><path d="M1730 2082H1990" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1930" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">7. SELECT candidates;</tspan><tspan x="1860" dy="28">for each user/type</tspan><tspan x="1860" dy="28">create snapshot</tspan><tspan x="1860" dy="28">PENDING revision only</tspan><tspan x="1860" dy="28">if no revision of any</tspan><tspan x="1860" dy="28">status exists</tspan></text><path d="M1990 2241H1730" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1860" y="2201" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">8. Synchronization</tspan><tspan x="1860" dy="28">complete</tspan></text><path d="M1730 2373H1430" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1580" y="2333" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">9. Synchronization</tspan><tspan x="1580" dy="28">complete</tspan></text><path d="M1430 2505H1130" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1280" y="2465" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">10. Synchronization</tspan><tspan x="1280" dy="28">complete</tspan></text><path d="M1130 2637H1430" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2569" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">11. findMany({page,</tspan><tspan x="1280" dy="28">limit, status,</tspan><tspan x="1280" dy="28">profileType, search})</tspan></text><path d="M1430 2825H1730" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2673" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">12. $transaction:</tspan><tspan x="1580" dy="28">profileRevision.findMany(</tspan><tspan x="1580" dy="28">skip, take, createdAt</tspan><tspan x="1580" dy="28">desc);</tspan><tspan x="1580" dy="28">profileRevision.count(sam</tspan><tspan x="1580" dy="28">e filters)</tspan></text><path d="M1730 3009.5H1990" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2885.5" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">13. SELECT matching</tspan><tspan x="1860" dy="28">revisions and COUNT;</tspan><tspan x="1860" dy="28">search</tspan><tspan x="1860" dy="28">email/displayName</tspan><tspan x="1860" dy="28">case-insensitive</tspan></text><path d="M1990 3143H1730" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1860" y="3103" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">14. { revisions,</tspan><tspan x="1860" dy="28">total }</tspan></text><path d="M1730 3275H1430" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1580" y="3263" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">15. { revisions, total }</tspan></text><path d="M1430 3407H1130" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1280" y="3395" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">16. { revisions, total }</tspan></text><path d="M1130 3539h55v28h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1280" y="3443" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">17. Build pagination: page,</tspan><tspan x="1280" dy="28">limit, total,</tspan><tspan x="1280" dy="28">totalPages=ceil(total/limit</tspan><tspan x="1280" dy="28">)</tspan></text><path d="M1130 3671H850" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="990" y="3603" text-anchor="middle" font-size="24"><tspan x="990" dy="0">18.</tspan><tspan x="990" dy="28">ProfileRevisionAdminLis</tspan><tspan x="990" dy="28">tDto</tspan></text><path d="M850 3803H590" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="720" y="3763" text-anchor="middle" font-size="24"><tspan x="720" dy="0">19. Return controller</tspan><tspan x="720" dy="28">result</tspan></text><path d="M590 3935H330" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="460" y="3867" text-anchor="middle" font-size="24"><tspan x="460" dy="0">20. 200 OK:</tspan><tspan x="460" dy="28">ProfileRevisionAdminL</tspan><tspan x="460" dy="28">istDto</tspan></text><path d="M330 4067H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="3971" text-anchor="middle" font-size="24"><tspan x="210" dy="0">21. Display history</tspan><tspan x="210" dy="28">with status, admin,</tspan><tspan x="210" dy="28">review notes and</tspan><tspan x="210" dy="28">reviewed time</tspan></text></g></g></g></svg>