 x="70" dy="0">ref</tspan></text><text x="120" y="5567" text-anchor="start" font-size="20"><tspan x="120" dy="0">CloudinaryService.uploadFile(file, frevia/cvs/userId): secure_url and public_id</tspan></text><rect x="25" y="5808.5" width="2060" height="127.5" fill="none" stroke="#555"/><text x="70" y="5835.5" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="5835.5" text-anchor="start" font-size="20"><tspan x="120" dy="0">mkdir/writeFile uploads/cvs/userId/UUID.pdf; cvUrl=local://path; cvPublicId=null</tspan></text><rect x="25" y="5459" width="2060" height="525" fill="none" stroke="#555"/><text x="70" y="5486" text-anchor="middle" font-size="22"><tspan x="70" dy="0">alt</tspan></text><text x="120" y="5486" text-anchor="start" font-size="20"><tspan x="120" dy="0">[Cloudinary configured]</tspan></text><rect x="25" y="6966" width="2060" height="135" fill="none" stroke="#555"/><text x="70" y="6993" text-anchor="middle" font-size="22"><tspan x="70" dy="0">ref</tspan></text><text x="120" y="6993" text-anchor="start" font-size="20"><tspan x="120" dy="0">After new metadata saved: Cloudinary.deleteFile(old publicId), else resolve safe local path and unlink(old file). Cleanup errors are ignored.</tspan></text><rect x="25" y="6885" width="2060" height="264" fill="none" stroke="#555"/><text x="70" y="6912" text-anchor="middle" font-size="22"><tspan x="70" dy="0">opt</tspan></text><text x="120" y="6912" text-anchor="start" font-size="20"><tspan x="120" dy="0">[previous CV has cvPublicId OR local:// URL]</tspan></text><path d="M25 5739.5h2060" stroke="#555" stroke-dasharray="8 6"/><text x="120" y="5767.5" text-anchor="start" font-size="20"><tspan x="120" dy="0">[else: local filesystem]</tspan></text><path d="M90 354H330" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="210" y="286" text-anchor="middle" font-size="24"><tspan x="210" dy="0">1. Choose</tspan><tspan x="210" dy="28">replacement PDF;</tspan><tspan x="210" dy="28">Upload</tspan></text><path d="M330 486H590" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="460" y="418" text-anchor="middle" font-size="24"><tspan x="460" dy="0">2. POST</tspan><tspan x="460" dy="28">/profiles/:id/cv</tspan><tspan x="460" dy="28">(body)</tspan></text><path d="M590 618H850" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="720" y="550" text-anchor="middle" font-size="24"><tspan x="720" dy="0">3.</tspan><tspan x="720" dy="28">uploadCv(profileId,</tspan><tspan x="720" dy="28">currentUserId, file)</tspan></text><path d="M590 1005H330" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="460" y="965" text-anchor="middle" font-size="24"><tspan x="460" dy="0">3.1.1. 401 / 403</tspan><tspan x="460" dy="28">error response</tspan></text><path d="M330 1137H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="1069" text-anchor="middle" font-size="24"><tspan x="210" dy="0">3.1.2. Display</tspan><tspan x="210" dy="28">authentication /</tspan><tspan x="210" dy="28">permission error</tspan></text><path d="M590 1572H330" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="460" y="1532" text-anchor="middle" font-size="24"><tspan x="460" dy="0">3.3.1. 400 validation</tspan><tspan x="460" dy="28">error</tspan></text><path d="M330 1704H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="1664" text-anchor="middle" font-size="24"><tspan x="210" dy="0">3.3.2. Display</tspan><tspan x="210" dy="28">validation message</tspan></text><path d="M850 1884H1130" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1844" text-anchor="middle" font-size="24"><tspan x="990" dy="0">4. uploadCv(profileId,</tspan><tspan x="990" dy="28">currentUserId, file)</tspan></text><path d="M1130 2044H1430" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1920" text-anchor="middle" font-size="24