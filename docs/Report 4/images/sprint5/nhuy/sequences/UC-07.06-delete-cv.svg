<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="4112" viewBox="0 0 2110 4112"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-07.06 — Delete CV</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Freelancer</tspan></text><line x1="90" y1="280" x2="90" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ProfileView</tspan></text><line x1="330" y1="225" x2="330" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="3680" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ProfileRoute</tspan></text><line x1="590" y1="225" x2="590" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="3668" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ProfileController</tspan></text><line x1="850" y1="225" x2="850" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="3656" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:ProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="3644" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:ProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="3632" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="3620" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="4072" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="3608" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1652" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1680h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1671" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1674" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile missing OR user lacks FREELANCER role]</tspan></text><rect x="35" y="2090" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2118h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2109" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2112" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile.userId != currentUserId]</tspan></text><rect x="35" y="2528" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2556h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2547" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2550" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[CV URL missing]</tspan></text><rect x="35" y="2966" width="2040" height="95" fill="none" stroke="#111"/><path d="M35 2994h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2985" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="2988" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">If cvPublicId: Cloudinary.deleteFile; else if local://: resolve safe path and unlink. Cleanup errors ignored; metadata clear follows.</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Delete uploaded CV</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. DELETE /profiles/:id/cv</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. deleteCv(profileId, currentUserId)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1048" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. deleteCv(profileId, currentUserId)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1119" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. getOwnedFreelancerProfile:</tspan><tspan x="1280" dy="17">findFreelancerProfileById(profileId)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1190" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(id); fallback</tspan><tspan x="1580" dy="17">findFirst(userId); include</tspan><tspan x="1580" dy="17">freelancerProfile and roles</tspan></text><line x1="1730" y1="1323" x2="1990" y2="1323" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1296" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT profile of non-deleted user</tspan><tspan x="1860" dy="17">with freelancer data and roles</tspan></text><line x1="1990" y1="1412" x2="1730" y2="1412" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1402" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1500" x2="1430" y2="1500" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1490" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1588" x2="1130" y2="1588" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1578" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Profile or null</tspan></text><line x1="1130" y1="1730" x2="850" y2="1730" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1703" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">FreelancerProfileNotFoundException</tspan></text><line x1="850" y1="1818" x2="590" y2="1818" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1808" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1906" x2="330" y2="1906" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1896" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1994" x2="90" y2="1994" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1984" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2168" x2="850" y2="2168" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2158" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 ProfileForbiddenException</tspan></text><line x1="850" y1="2256" x2="590" y2="2256" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2246" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2344" x2="330" y2="2344" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2334" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2432" x2="90" y2="2432" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2422" text-anchor="middle" font-size="13"><tspan x="210" dy="0">12.4. Display error message</tspan></text><line x1="1130" y1="2606" x2="850" y2="2606" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2596" text-anchor="middle" font-size="13"><tspan x="990" dy="0">13.1. 404 CvNotFoundException</tspan></text><line x1="850" y1="2694" x2="590" y2="2694" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2684" text-anchor="middle" font-size="13"><tspan x="720" dy="0">13.2. Propagate HTTP error</tspan></text><line x1="590" y1="2782" x2="330" y2="2782" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2772" text-anchor="middle" font-size="13"><tspan x="460" dy="0">13.3. Return error response</tspan></text><line x1="330" y1="2870" x2="90" y2="2870" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2860" text-anchor="middle" font-size="13"><tspan x="210" dy="0">13.4. Display error message</tspan></text><line x1="1130" y1="3121" x2="1430" y2="3121" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3111" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">14. clearCv(profile.id)</tspan></text><line x1="1430" y1="3209" x2="1730" y2="3209" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3182" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">15. freelancerProfile.update(profileId; CV</tspan><tspan x="1580" dy="17">fields null)</tspan></text><line x1="1730" y1="3298" x2="1990" y2="3298" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3271" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. SET cvUrl, cvFileName,</tspan><tspan x="1860" dy="17">cvPublicId, cvUploadedAt to NULL</tspan></text><line x1="1990" y1="3386" x2="1730" y2="3386" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3376" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">17. Cleared CV metadata</tspan></text><line x1="1730" y1="3474" x2="1430" y2="3474" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3464" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">18. Cleared CV metadata</tspan></text><line x1="1430" y1="3562" x2="1130" y2="3562" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3552" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">19. Cleared CV metadata</tspan></text><line x1="1130" y1="3650" x2="850" y2="3650" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3623" text-anchor="middle" font-size="13"><tspan x="990" dy="0">20. { message: CV deleted successfully.</tspan><tspan x="990" dy="17">}</tspan></text><line x1="850" y1="3738" x2="590" y2="3738" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3728" text-anchor="middle" font-size="13"><tspan x="720" dy="0">21. Return controller result</tspan></text><line x1="590" y1="3826" x2="330" y2="3826" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3799" text-anchor="middle" font-size="13"><tspan x="460" dy="0">22. 200 OK: { message: CV deleted</tspan><tspan x="460" dy="17">successfully. }</tspan></text><line x1="330" y1="3914" x2="90" y2="3914" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3887" text-anchor="middle" font-size="13"><tspan x="210" dy="0">23. Clear displayed CV filename</tspan><tspan x="210" dy="17">and link; show success</tspan></text></g></svg>
