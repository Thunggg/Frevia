<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="2824" viewBox="0 0 2110 2824"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-47.01 — View Pending Profile Update Request List</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Administrator</tspan></text><line x1="90" y1="280" x2="90" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ProfileRevisionAdminView</tspan></text><line x1="330" y1="225" x2="330" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="2392" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ProfileRevisionAdminRoute</tspan></text><line x1="590" y1="225" x2="590" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="2380" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ProfileRevisionAdminController</tspan></text><line x1="850" y1="225" x2="850" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="2368" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:ProfileRevisionService</tspan></text><line x1="1130" y1="225" x2="1130" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="2356" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:ProfileRevisionRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="2344" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="2332" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="2784" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="2320" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open pending profile requests</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET</tspan><tspan x="460" dy="17">/admin/profile-revisions?status=PENDING&amp;page=&amp;limit=&amp;profileType=&amp;search=</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. list(filter)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1048" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. list(filter)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. syncLowStrengthProfiles(20)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1190" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findMany(strength &lt;20; active</tspan><tspan x="1580" dy="17">non-banned users with primary</tspan><tspan x="1580" dy="17">CLIENT/FREELANCER/EXPERT); $transaction</tspan></text><line x1="1730" y1="1340" x2="1990" y2="1340" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1279" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT candidates; for each</tspan><tspan x="1860" dy="17">user/type create snapshot PENDING</tspan><tspan x="1860" dy="17">revision only if no revision of any</tspan><tspan x="1860" dy="17">status exists</tspan></text><line x1="1990" y1="1446" x2="1730" y2="1446" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1436" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Synchronization complete</tspan></text><line x1="1730" y1="1534" x2="1430" y2="1534" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1524" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Synchronization complete</tspan></text><line x1="1430" y1="1622" x2="1130" y2="1622" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1612" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Synchronization complete</tspan></text><line x1="1130" y1="1710" x2="1430" y2="1710" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1683" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">11. findMany({page, limit, status,</tspan><tspan x="1280" dy="17">profileType, search})</tspan></text><line x1="1430" y1="1798" x2="1730" y2="1798" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1737" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">12. $transaction:</tspan><tspan x="1580" dy="17">profileRevision.findMany(skip, take,</tspan><tspan x="1580" dy="17">createdAt desc);</tspan><tspan x="1580" dy="17">profileRevision.count(same filters)</tspan></text><line x1="1730" y1="1921" x2="1990" y2="1921" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1877" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">13. SELECT matching revisions and</tspan><tspan x="1860" dy="17">COUNT; search email/displayName</tspan><tspan x="1860" dy="17">case-insensitive</tspan></text><line x1="1990" y1="2010" x2="1730" y2="2010" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="2000" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">14. { revisions, total }</tspan></text><line x1="1730" y1="2098" x2="1430" y2="2098" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="2088" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">15. { revisions, total }</tspan></text><line x1="1430" y1="2186" x2="1130" y2="2186" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2176" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">16. { revisions, total }</tspan></text><path d="M1130 2274h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2247" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">17. Build pagination: page, limit,</tspan><tspan x="1265" dy="17">total, totalPages=ceil(total/limit)</tspan></text><line x1="1130" y1="2362" x2="850" y2="2362" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2352" text-anchor="middle" font-size="13"><tspan x="990" dy="0">18. ProfileRevisionAdminListDto</tspan></text><line x1="850" y1="2450" x2="590" y2="2450" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2440" text-anchor="middle" font-size="13"><tspan x="720" dy="0">19. Return controller result</tspan></text><line x1="590" y1="2538" x2="330" y2="2538" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2511" text-anchor="middle" font-size="13"><tspan x="460" dy="0">20. 200 OK:</tspan><tspan x="460" dy="17">ProfileRevisionAdminListDto</tspan></text><line x1="330" y1="2626" x2="90" y2="2626" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2599" text-anchor="middle" font-size="13"><tspan x="210" dy="0">21. Display pending request list</tspan><tspan x="210" dy="17">or empty state</tspan></text></g></svg>
