ody" x="562" y="571">undefined</text><rect class="frame" x="1070" y="354" width="480" height="170"/><text class="stereo" text-anchor="middle" x="1310" y="374">&lt;&lt;guard&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="397">PermissionGuard</text><text class="body" x="1082" y="431">- reflector: Reflector</text><text class="body" x="1082" y="452">- sharedPermissionRepository: SharedPermissionRepository</text><path d="M1070 468H1550" class="edge"/><text class="body" x="1082" y="487">+ canActivate(context: ExecutionContext):</text><text class="body" x="1082" y="508">Promise&amp;lt;boolean&amp;gt;</text><rect class="frame" x="1590" y="354" width="480" height="149"/><text class="stereo" text-anchor="middle" x="1830" y="374">&lt;&lt;repository&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="397">SharedPermissionRepository</text><text class="body" x="1602" y="431">- prisma: PrismaService</text><path d="M1590 447H2070" class="edge"/><text class="body" x="1602" y="466">+ roleHasPermission(roleId: number, method: string,</text><text class="body" x="1602" y="487">path: string)</text><rect class="frame" x="30" y="687" width="480" height="282"/><text class="stereo" text-anchor="middle" x="270" y="707">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="730">ClientProfileDetailDto</text><text class="body" x="42" y="764">+ id: number</text><text class="body" x="42" y="785">+ userId: number</text><text class="body" x="42" y="806">+ displayName: string | null</text><text class="body" x="42" y="827">+ avatarUrl: string | null</text><text class="body" x="42" y="848">+ coverUrl: string | null</text><text class="body" x="42" y="869">+ bio: string | null</text><text class="body" x="42" y="890">+ profileCompletionPercent: number</text><text class="body" x="42" y="911">+ createdAt: string | Date</text><text class="body" x="42" y="932">+ clientProfile: object (see DTO schema)</text><text class="body" x="42" y="953">+ socialLinks: