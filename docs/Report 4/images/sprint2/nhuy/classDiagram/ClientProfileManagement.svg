ight="19" fill="white"/><text class="label" x="2299" y="524">queries grants</text><path class="edge" d="M 2070 946.2 L 2095 946.2 L 2095 1036 L 2130 1036 L 2130 1076 L 790 1076 L 790 1111" marker-end="url(#arrow)"/><rect x="2061" y="1018" width="138" height="19" fill="white"/><text class="label" x="2130" y="1032">availabilityStatus</text><path class="edge" d="M 2070 946.2 L 2095 946.2 L 2095 1036 L 2143 1036 L 2143 1076 L 270 1076 L 270 1111" marker-end="url(#arrow)"/><rect x="2091.5" y="1018" width="103" height="19" fill="white"/><text class="label" x="2143" y="1032">clientProfile</text><path class="edge" d="M 510 1286.2 L 535 1286.2 L 535 1355 L 2156 1355 L 2156 652 L 1830 652 L 1830 687" marker-end="url(#arrow)"/><rect x="2125.5" y="1337" width="61" height="19" fill="white"/><text class="label" x="2156" y="1351">profile</text><rect class="frame" x="30" y="90" width="430" height="135"/><text class="stereo" text-anchor="middle" x="245" y="110">&lt;&lt;route&gt;&gt;</text><text class="head" text-anchor="middle" x="245" y="133">ClientProfileManagementRoutes</text><text class="body" x="42" y="167">+ GET /clients/:userId [public]</text><text class="body" x="42" y="188">+ PUT /clients/me/profile [AuthGuard,</text><text class="body" x="42" y="209">PermissionGuard]</text><rect class="frame" x="540" y="90" width="430" height="148"/><text class="head" text-anchor="middle" x="755" y="115">ClientProfileController</text><text class="body" x="552" y="145">- service: AccountProfileService</text><path d="M540 161H970" class="edge"/><text class="body" x="552" y="180">+ getDetail(userId: number)</text><text class="body" x="552" y="201">+ update(userId: number, body:</text><text class="body" x="552" y="222">UpdateClientProfileDto)</text><rect class="frame" x="1050" y="90" width="480" height="169"/><text class="head" text-anchor="middle" x="1290" y="115">AccountProfileService</text><text class="body" x="1062" y="145">- repository: AccountProfileRepository</text><text class="body" x="