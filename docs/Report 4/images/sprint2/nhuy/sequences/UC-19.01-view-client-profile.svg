<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="2099" viewBox="0 0 2110 2099"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-19.01 — View Client Profile</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Public endpoint (@IsPublic) • no JWT required • return arrows are dashed</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Visitor / User</tspan></text><line x1="90" y1="280" x2="90" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ClientProfileView</tspan></text><line x1="330" y1="225" x2="330" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="1667" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ClientProfileRoute</tspan></text><line x1="590" y1="225" x2="590" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="1655" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ClientProfileController</tspan></text><line x1="850" y1="225" x2="850" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="1643" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:AccountProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="1631" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:AccountProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="1619" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="1607" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="2059" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="1595" fill="white" stroke="#111"/><rect x="35" y="1175" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1203h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1194" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1197" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[clientProfile missing OR user lacks CLIENT role]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open client profile</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /clients/:userId</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. getDetail(userId) -&gt;</tspan><tspan x="720" dy="17">getClientProfile(userId)</tspan></text><line x1="850" y1="564" x2="1130" y2="564" stroke="#111"  marker-end="url(#call)"/><text x="990" y="537" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. getDetail(userId) -&gt;</tspan><tspan x="990" dy="17">getClientProfile(userId)</tspan></text><line x1="1130" y1="652" x2="1430" y2="652" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="642" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findClientProfile(userId)</tspan></text><line x1="1430" y1="740" x2="1730" y2="740" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="696" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(userId;</tspan><tspan x="1580" dy="17">user.deletedAt null; include</tspan><tspan x="1580" dy="17">clientProfile, socialLinks, user roles)</tspan></text><line x1="1730" y1="846" x2="1990" y2="846" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="819" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active client profile with</tspan><tspan x="1860" dy="17">social links ordered by platform</tspan></text><line x1="1990" y1="935" x2="1730" y2="935" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="925" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1023" x2="1430" y2="1023" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1013" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1111" x2="1130" y2="1111" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1101" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Profile or null</tspan></text><line x1="1130" y1="1253" x2="850" y2="1253" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1243" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ClientProfileNotFoundException</tspan></text><line x1="850" y1="1341" x2="590" y2="1341" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1331" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1429" x2="330" y2="1429" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1419" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1517" x2="90" y2="1517" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1507" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="1637" x2="850" y2="1637" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1627" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12. ClientProfileDetailDto</tspan></text><line x1="850" y1="1725" x2="590" y2="1725" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1715" text-anchor="middle" font-size="13"><tspan x="720" dy="0">13. Return controller result</tspan></text><line x1="590" y1="1813" x2="330" y2="1813" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1803" text-anchor="middle" font-size="13"><tspan x="460" dy="0">14. 200 OK: ClientProfileDetailDto</tspan></text><line x1="330" y1="1901" x2="90" y2="1901" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1874" text-anchor="middle" font-size="13"><tspan x="210" dy="0">15. Display client profile and</tspan><tspan x="210" dy="17">company information</tspan></text></g></svg>
