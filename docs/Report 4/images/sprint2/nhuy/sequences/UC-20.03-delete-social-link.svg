="13"><tspan x="720" dy="0">3. remove(userId, id) -&gt;</tspan><tspan x="720" dy="17">deleteSocialLink(userId, id)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1031" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. remove(userId, id) -&gt;</tspan><tspan x="990" dy="17">deleteSocialLink(userId, id)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findSocialLinkById(id)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1207" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. socialLink.findUnique(id; include</tspan><tspan x="1580" dy="17">profile)</tspan></text><line x1="1730" y1="1322" x2="1990" y2="1322" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1295" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT SocialLink and owner</tspan><tspan x="1860" dy="17">profile</tspan></text><line x1="1990" y1="1410" x2="1730" y2="1410" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1400" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Social link or null</tspan></text><line x1="1730" y1="1498" x2="1430" y2="1498" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1488" text-anchor=