n controller result</tspan></text><line x1="590" y1="3254" x2="330" y2="3254" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3227" text-anchor="middle" font-size="13"><tspan x="460" dy="0">21. 200 OK: { message: Social link</tspan><tspan x="460" dy="17">deleted successfully. }</tspan></text><line x1="330" y1="3342" x2="90" y2="3342" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3315" text-anchor="middle" font-size="13"><tspan x="210" dy="0">22. Remove link from local list;</tspan><tspan x="210" dy="17">show success</tspan></text></g></svg>
