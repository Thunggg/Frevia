rker-end="url(#reply)"/><text x="990" y="2967" text-anchor="middle" font-size="13"><tspan x="990" dy="0">18.1. 409 SocialLinkDuplicateException</tspan></text><line x1="850" y1="3065" x2="590" y2="3065" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3055" text-anchor="middle" font-size="13"><tspan x="720" dy="0">18.2. Propagate HTTP error</tspan></text><line x1="590" y1="3153" x2="330" y2="3153" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3143" text-anchor="middle" font-size="13"><tspan x="460" dy="0">18.3. Return error response</tspan></text><line x1="330" y1="3241" x2="90" y2="3241" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3231" text-anchor="middle" font-size="13"><tspan x="210" dy="0">18.4. Display error message</tspan></text><line x1="1130" y1="3361" x2="1430" y2="3361" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3351" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">19. createSocialLink(userId, input)</tspan></text><line x1="1430" y1="3449" x2="1730" y2="3449" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3405" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">20. profile.findUniqueOrThrow(userId);</tspan><tspan x="1580" dy="17">socialLink.create(profileId, platform,</tspan><tspan x="1580" dy="17">url)</tspan></text><line x1="1730" y1="3555" x2="1990" y2="3555" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3528" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">21. INSERT SocialLink for current</tspan><tspan x="1860" dy="17">profile</tspan></text><line x1="1990" y1="3643" x2="1730" y2="3643" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3633" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">22. Created social link</tspan></text><line x1="1730" y1="3731" x2="1430" y2="3731" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="158