elect platform, enter URL; Add</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST /social-links</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. add(userId, body) -&gt;</tspan><tspan x="720" dy="17">addSocialLink(userId, input)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1112" x2="330" y2="1112" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1102" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1200" x2="90" y2="1200" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1190" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1320" x2="1130" y2="1320" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1293" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. add(userId, body) -&gt;</tspan><tspan x="990" dy="17">addSocialLink(userId, input)</tspan></text><line x1="1130" y1="1408" x2="1430" y2="1408" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1398" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findSocialLinks(userId)</tspan></text><line x1=