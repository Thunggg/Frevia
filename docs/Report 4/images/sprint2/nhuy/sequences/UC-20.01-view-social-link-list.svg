<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="2593" viewBox="0 0 2110 2593"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-20.01 — View Social Link List</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Authenticated User</tspan></text><line x1="90" y1="280" x2="90" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:SocialLinkView</tspan></text><line x1="330" y1="225" x2="330" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="2161" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:SocialLinkRoute</tspan></text><line x1="590" y1="225" x2="590" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="2149" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:SocialLinkController</tspan></text><line x1="850" y1="225" x2="850" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="2137" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:AccountProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="2125" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:AccountProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="2113" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="2101" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="2553" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="2089" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1669" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1697h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1688" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1691" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile missing: result is null]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open social links settings</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /social-links</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. getAll(userId) -&gt;</tspan><tspan x="720" dy="17">getSocialLinks(userId)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1031" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. getAll(userId) -&gt;</tspan><tspan x="990" dy="17">getSocialLinks(userId)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findSocialLinks(userId)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1190" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findUnique(userId); if present</tspan><tspan x="1580" dy="17">socialLink.findMany(profileId; platform</tspan><tspan x="1580" dy="17">asc)</tspan></text><line x1="1730" y1="1340" x2="1990" y2="1340" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1296" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT Profile; SELECT social</tspan><tspan x="1860" dy="17">links ordered by platform if profile</tspan><tspan x="1860" dy="17">exists</tspan></text><line x1="1990" y1="1429" x2="1730" y2="1429" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1402" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. SocialLink[] or null if profile</tspan><tspan x="1860" dy="17">missing</tspan></text><line x1="1730" y1="1517" x2="1430" y2="1517" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1507" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. SocialLink[] or null if profile missing</tspan></text><line x1="1430" y1="1605" x2="1130" y2="1605" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1578" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. SocialLink[] or null if profile</tspan><tspan x="1280" dy="17">missing</tspan></text><line x1="1130" y1="1747" x2="850" y2="1747" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1737" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="1835" x2="590" y2="1835" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1825" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1923" x2="330" y2="1923" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1913" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2011" x2="90" y2="2011" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2001" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2131" x2="850" y2="2131" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2121" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12. SocialLinkListDto</tspan></text><line x1="850" y1="2219" x2="590" y2="2219" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2209" text-anchor="middle" font-size="13"><tspan x="720" dy="0">13. Return controller result</tspan></text><line x1="590" y1="2307" x2="330" y2="2307" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2297" text-anchor="middle" font-size="13"><tspan x="460" dy="0">14. 200 OK: SocialLinkListDto</tspan></text><line x1="330" y1="2395" x2="90" y2="2395" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2368" text-anchor="middle" font-size="13"><tspan x="210" dy="0">15. Display social links or empty</tspan><tspan x="210" dy="17">list</tspan></text></g></svg>
