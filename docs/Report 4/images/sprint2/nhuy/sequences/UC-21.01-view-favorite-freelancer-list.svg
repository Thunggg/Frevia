ancerController</tspan></text><line x1="850" y1="225" x2="850" y2="3609" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="3193" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:AccountProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="3609" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="3181" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:AccountProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="3609" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="3169" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="3609" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="3157" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="3609" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="3145" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1651" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1679h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1670" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1673" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user or profile missing]</tspan></text><rect x="35" y="2089" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2117h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2108" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2111" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user lacks CLIENT role]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open favorite freelancers</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /favorites/freelancers</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" 