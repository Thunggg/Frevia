<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1850" viewBox="0 0 2600 1850"><title>Review Management class diagram</title><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#30343b" stroke-width="1.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d232b}.frame{fill:#fff;stroke:#30343b;stroke-width:2}.head{font-size:18px;font-weight:bold}.stereo{font-size:13px;font-style:italic}.body{font-size:15px}.edge{fill:none;stroke:#414851;stroke-width:1.7}.label{font-size:12px;text-anchor:middle}</style></defs><rect width="100%" height="100%" fill="#fff"/><path class="edge" d="M 460 231 L 488 231 L 512 231 L 512 206 L 540 206" marker-end="url(#arrow)"/><rect x="481.5" y="213" width="61" height="19" fill="white"/><text class="label" x="512" y="227">maps to</text><path class="edge" d="M 970 206 L 998 206 L 1022 206 L 1022 206 L 1050 206" marker-end="url(#arrow)"/><rect x="992" y="188" width="60" height="19" fill="white"/><text class="label" x="1022" y="202">calls</text><path class="edge" d="M 1530 206 L 1558 206 L 1582 206 L 1582 237.5 L 1610 237.5" marker-end="url(#arrow)"/><rect x="1552" y="188" width="60" height="19" fill="white"/><text class="label" x="1582" y="202">calls</text><path class="edge" d="M 2090 326 L 2115 326 L 2115 410 L 2169 410 L 2169 445 L 270 445 L 270 480" marker-end="url(#arrow)"/><rect x="2139" y="392" width="60" height="19" fill="white"/><text class="label" x="2169" y="406">uses</text><path class="edge" d="M 460 315.6 L 485 315.6 L 485 397 L 2182 397 L 2182 445 L 790 445 L 790 480" marker-end="url(#arrow)"/><rect x="2106" y="379" width="152" height="19" fill="white"/><text class="label" x="2182" y="393">authenticated routes</text><path class="edge" d="M 460 315.6 L 485 315.6 L 485 397 L 2195 397 L 2195 445 L 1310 445 L 1310 480" marker-end="url(#arrow)"/><rect x="2119" y="379" width="152" height="19"