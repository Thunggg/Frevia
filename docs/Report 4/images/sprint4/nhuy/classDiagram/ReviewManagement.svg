ath class="edge" d="M 510 1525.6 L 535 1525.6 L 535 1607 L 2130 1607 L 2130 1265 L 790 1265 L 790 1300" marker-end="url(#arrow)"/><rect x="2096" y="1589" width="68" height="19" fill="white"/><text class="label" x="2130" y="1603">contract</text><path class="edge" d="M 1030 1660 L 1055 1660 L 1055 1775 L 2143 1775 L 2143 1265 L 1310 1265 L 1310 1300" marker-end="url(#arrow)"/><rect x="2113" y="1757" width="60" height="19" fill="white"/><text class="label" x="2143" y="1771">status</text><path class="edge" d="M 1030 1660 L 1055 1660 L 1055 1775 L 2156 1775 L 2156 1265 L 1830 1265 L 1830 1300" marker-end="url(#arrow)"/><rect x="2090.5" y="1757" width="131" height="19" fill="white"/><text class="label" x="2156" y="1771">platformFeeStatus</text><path class="edge" d="M 1030 1660 L 1055 1660 L 1055 1775 L 2169 1775 L 2169 1265 L 270 1265 L 270 1300" marker-end="url(#arrow)"/><rect x="2138.5" y="1757" width="61" height="19" fill="white"/><text class="label" x="2169" y="1771">reviews</text><rect class="frame" x="30" y="90" width="430" height="282"/><text class="stereo" text-anchor="middle" x="245" y="110">&lt;&lt;route&gt;&gt;</text><text class="head" text-anchor="middle" x="245" y="133">ReviewManagementRoutes</text><text class="body" x="42" y="167">+ GET /reviews/contracts/:contractId [AuthGuard,</text><text class="body" x="42" y="188">PermissionGuard]</text><text class="body" x="42" y="209">+ POST /reviews/contracts/:contractId [AuthGuard,</text><text class="body" x="42" y="230">PermissionGuard]</text><text class="body" x="42" y="251">+ GET /reviews/:reviewId [AuthGuard,</text><text class="body" x="42" y="272">PermissionGuard]</text><text class="body" x="42" y="293">+ PATCH /reviews/:reviewId [AuthGuard,</text><text class="body" x="42" y="314">PermissionGuard]</text><text class="body" x="42" y="335">+ DELETE /reviews/:reviewId [AuthGuard,</text><text class="body" x="42" y="356">PermissionGuard]</text><rect class="frame" x="540" y="90" width="430" height="232"/><text class="head" text-anchor="middle" x="755" y="115">ReviewController</text><text class="body" x="552" y="145">- service: ReviewService</text><path d="M540 161H970" class="edge"/><text class="body" x="552" y="180">+ list(userId: number, contractId: number)</text><text class="body" x="552" y="201">+ create(userId: number, contractId: number, body:</text><text class="body" x="552" y="222">CreateReviewDto)</text><text class="body" x="552" y="243">+ detail(userId: number, reviewId: number)</text><text class="body" x="552" y="264">+ update(userId: number, reviewId: number, body:</text><text class="body" x="552" y="285">UpdateReviewDto)</text><text class="body" x="552" y="306">+ remove(userId: number, reviewId: number)</text><rect class="frame" x="1050" y="90" width="480" height="232"/><text class="head" text-anchor="middle" x="1290" y="115">ReviewService</text><text class="body" x="1062" y="145">- repository: ReviewRepository</text><path d="M1050 161H1530" class="edge"/><text class="body" x="1062" y="180">+ list(userId: number, contractId: number)</text><text class="body" x="1062" y="201">+ detail(userId: number, reviewId: number)</text><text class="body" x="1062" y="222">+ create(userId: number, contractId: number, input:</text><text class="body" x="1062" y="243">CreateReviewType)</text><text class="body" x="1062" y="264">+ update(userId: number, reviewId: number, input:</text><text class="body" x="1062" y="285">UpdateReviewType)</text><text class="body" x="1062" y="306">+ remove(userId: number, reviewId: number)</text><rect class="frame" x="1610" y="90" width="480" height="295"/><text class="head" text-anchor="middle" x="1850" y="115">ReviewRepository</text><text class="body" x="1622" y="145">- prisma: PrismaService</text><path d="M1610 161H2090" class="edge"/><text class="body" x="1622" y="180">+ findContract(contractId: number)</text><text class="body" x="1622" y="201">+ findById(reviewId: number, includeDeleted?: boolean)</text><text class="body" x="1622" y="222">+ findByContractAndReviewer(contractId: number,</text><text class="body" x="1622" y="243">reviewerId: number)</text><text class="body" x="1622" y="264">+ findManyByContract(contractId: number)</text><text class="body" x="1622" y="285">+ create(contractId: number, reviewerId: number,</text><text class="body" x="1622" y="306">revieweeId: number, reviewerName: string, input:</text><text class="body" x="1622" y="327">CreateReviewType)</text><text class="body" x="1622" y="348">+ update(reviewId: number, input: UpdateReviewType)</text><text class="body" x="1622" y="369">+ softDelete(reviewId: number)</text><rect class="frame" x="30" y="480" width="480" height="114"/><text class="stereo" text-anchor="middle" x="270" y="500">&lt;&lt;infrastructure&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="523">PrismaService</text><text class="body" x="42" y="557">extends PrismaClient</text><text class="body" x="42" y="578">Generated model delegates and $transaction</text><rect class="frame" x="550" y="480" width="480" height="233"/><text class="stereo" text-anchor="middle" x="790" y="500">&lt;&lt;guard&gt;&gt;</text><text class="head" text-anchor="middle" x="790" y="523">AuthGuard</text><text class="body" x="562" y="557">- tokenService: TokenService</text><text class="body" x="562" y="578">- prisma: PrismaService</text><text class="body" x="562" y="599">- reflector: Reflector</text><path d="M550 615H1030" class="edge"/><text class="body" x="562" y="634">+ canActivate(context: ExecutionContext):</text><text class="body" x="562" y="655">Promise&amp;lt;boolean&amp;gt;</text><text class="body" x="562" y="676">- extractTokenFromHeader(request: Request): string |</text><text class="body" x="562" y="697">undefined</text><rect class="frame" x="1070" y="480" width="480" height="170"/><text class="stereo" text-anchor="middle" x="1310" y="500">&lt;&lt;guard&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="523">PermissionGuard</text><text class="body" x="1082" y="557">- reflector: Reflector</text><text class="body" x="1082" y="578">- sharedPermissionRepository: SharedPermissionRepository</text><path d="M1070 594H1550" class="edge"/><text class="body" x="1082" y="613">+ canActivate(context: ExecutionContext):</text><text class="body" x="1082" y="634">Promise&amp;lt;boolean&amp;gt;</text><rect class="frame" x="1590" y="480" width="480" height="149"/><text class="stereo" text-anchor="middle" x="1830" y="500">&lt;&lt;repository&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="523">SharedPermissionRepository</text><text class="body" x="1602" y="557">- prisma: PrismaService</text><path d="M1590 573H2070" class="edge"/><text class="body" x="1602" y="592">+ roleHasPermission(roleId: number, method: string,</text><text class="body" x="1602" y="613">path: string)</text><rect class="frame" x="30" y="813" width="480" height="93"/><text class="stereo" text-anchor="middle" x="270" y="833">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="856">ReviewListDto</text><text class="body" x="42" y="890">Array response: ReviewListSchema</text><rect class="frame" x="550" y="813" width="480" height="135"/><text class="stereo" text-anchor="middle" x="790" y="833">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="790" y="856">CreateReviewDto</text><text class="body" x="562" y="890">+ overallRating: number</text><text class="body" x="562" y="911">+ breakdown: Record&amp;lt;string, number&amp;gt; | null | undefined</text><text class="body" x="562" y="932">+ comment: string | null | undefined</text><rect class="frame" x="1070" y="813" width="480" height="387"/><text class="stereo" text-anchor="middle" x="1310" y="833">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="856">ReviewDto</text><text class="body" x="1082" y="890">+ id: number</text><text class="body" x="1082" y="911">+ contractId: number</text><text class="body" x="1082" y="932">+ reviewerId: number</text><text class="body" x="1082" y="953">+ revieweeId: number</text><text class="body" x="1082" y="974">+ overallRating: number</text><text class="body" x="1082" y="995">+ breakdown: Record&amp;lt;string, number&amp;gt; | null</text><text class="body" x="1082" y="1016">+ comment: string | null</text><text class="body" x="1082" y="1037">+ createdAt: string | Date</text><text class="body" x="1082" y="1058">+ updatedAt: string | Date</text><text class="body" x="1082" y="1079">+ deletedAt: string | Date | null</text><text class="body" x="1082" y="1100">+ reviewer: { id: number; profile: { displayName: string</text><text class="body" x="1082" y="1121">| null; avatarUrl: string | null; } | null; }</text><text class="body" x="1082" y="1142">+ reviewee: { id: number; profile: { displayName: string</text><text class="body" x="1082" y="1163">| null; avatarUrl: string | null; } | null; }</text><text class="body" x="1082" y="1184">+ response: object (see DTO schema)</text><rect class="frame" x="1590" y="813" width="480" height="135"/><text class="stereo" text-anchor="middle" x="1830" y="833">&lt;&lt;dto&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="856">UpdateReviewDto</text><text class="body" x="1602" y="890">+ overallRating: number | undefined</text><text class="body" x="1602" y="911">+ breakdown: Record&amp;lt;string, number&amp;gt; | null | undefined</text><text class="body" x="1602" y="932">+ comment: string | null | undefined</text><rect class="frame" x="30" y="1300" width="480" height="282"/><text class="stereo" text-anchor="middle" x="270" y="1320">&lt;&lt;schema&gt;&gt;</text><text class="head" text-anchor="middle" x="270" y="1343">Review</text><text class="body" x="42" y="1377">+ id: Int</text><text class="body" x="42" y="1398">+ contractId: Int</text><text class="body" x="42" y="1419">+ reviewerId: Int</text><text class="body" x="42" y="1440">+ revieweeId: Int</text><text class="body" x="42" y="1461">+ overallRating: Decimal</text><text class="body" x="42" y="1482">+ breakdown: Json?</text><text class="body" x="42" y="1503">+ comment: String?</text><text class="body" x="42" y="1524">+ createdAt: DateTime</text><text class="body" x="42" y="1545">+ updatedAt: DateTime</text><text class="body" x="42" y="1566">+ deletedAt: DateTime?</text><rect class="frame" x="550" y="1300" width="480" height="450"/><text class="stereo" text-anchor="middle" x="790" y="1320">&lt;&lt;schema&gt;&gt;</text><text class="head" text-anchor="middle" x="790" y="1343">Contract</text><text class="body" x="562" y="1377">+ id: Int</text><text class="body" x="562" y="1398">+ jobId: Int</text><text class="body" x="562" y="1419">+ proposalId: Int</text><text class="body" x="562" y="1440">+ clientId: Int</text><text class="body" x="562" y="1461">+ freelancerId: Int</text><text class="body" x="562" y="1482">+ terms: String?</text><text class="body" x="562" y="1503">+ totalAmount: Decimal</text><text class="body" x="562" y="1524">+ status: ContractStatus</text><text class="body" x="562" y="1545">+ signedByClient: Boolean</text><text class="body" x="562" y="1566">+ signedByFreelancer: Boolean</text><text class="body" x="562" y="1587">+ platformFee: Decimal</text><text class="body" x="562" y="1608">+ platformFeeStatus: PlatformFeeStatus</text><text class="body" x="562" y="1629">+ platformFeePaidAt: DateTime?</text><text class="body" x="562" y="1650">+ createdAt: DateTime</text><text class="body" x="562" y="1671">+ signedAt: DateTime?</text><text class="body" x="562" y="1692">+ completedAt: DateTime?</text><text class="body" x="562" y="1713">+ expiresAt: DateTime?</text><text class="body" x="562" y="1734">+ deletedAt: DateTime?</text><rect class="frame" x="1070" y="1300" width="480" height="177"/><text class="stereo" text-anchor="middle" x="1310" y="1320">&lt;&lt;enum&gt;&gt;</text><text class="head" text-anchor="middle" x="1310" y="1343">ContractStatus</text><text class="body" x="1082" y="1377">PENDING_SIGN</text><text class="body" x="1082" y="1398">ACTIVE</text><text class="body" x="1082" y="1419">COMPLETED</text><text class="body" x="1082" y="1440">DISPUTED</text><text class="body" x="1082" y="1461">CANCELLED</text><rect class="frame" x="1590" y="1300" width="480" height="135"/><text class="stereo" text-anchor="middle" x="1830" y="1320">&lt;&lt;enum&gt;&gt;</text><text class="head" text-anchor="middle" x="1830" y="1343">PlatformFeeStatus</text><text class="body" x="1602" y="1377">UNPAID</text><text class="body" x="1602" y="1398">PAID</text><text class="body" x="1602" y="1419">WAIVED</text></svg>