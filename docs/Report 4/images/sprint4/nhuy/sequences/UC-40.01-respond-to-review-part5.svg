ion</tspan><tspan x="460" dy="28">error</tspan></text><path d="M330 1677.5H90" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="210" y="1637.5" text-anchor="middle" font-size="24"><tspan x="210" dy="0">3.3.2. Display</tspan><tspan x="210" dy="28">validation message</tspan></text><path d="M850 1857.5H1130" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1817.5" text-anchor="middle" font-size="24"><tspan x="990" dy="0">4. respond(userId,</tspan><tspan x="990" dy="28">reviewId, responseText)</tspan></text><path d="M1130 1989.5H1430" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1977.5" text-anchor="middle" font-size="24"><tspan x="1280" dy="0">5. findById(reviewId)</tspan></text><path d="M1430 2121.5H1730" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2025.5" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">6. review.findFirst(id;</tspan><tspan x="1580" dy="28">deletedAt null; select</tspan><tspan x="1580" dy="28">review, reviewer,</tspan><tspan x="1580" dy="28">reviewee, response)</tspan></text><path d="M1730 2255H1990" fill="none" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2187" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">7. SELECT active</tspan><tspan x="1860" dy="28">Review with parties</tspan><tspan x="1860" dy="28">and response</tspan></text><path d="M1990 2387H1730" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1860" y="2375" text-anchor="middle" font-size="24"><tspan x="1860" dy="0">8. Review or null</tspan></text><path d="M1730 2519H1430" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1580" y="2507" text-anchor="middle" font-size="24"><tspan x="1580" dy="0">9. Review or null</tspan></text><path d="M1430 2651H1130" fill="none" stroke="#111" stroke-dasharray="9 7" marker-end="url(#reply)"/><text x="1280" y="2639" text-anchor="middle" font-size="24