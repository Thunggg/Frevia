1675" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1665" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. User or null</tspan></text><line x1="1730" y1="1763" x2="1430" y2="1763" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1753" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. User or null</tspan></text><line x1="1430" y1="1851" x2="1130" y2="1851" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1841" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. User or null</tspan></text><line x1="1130" y1="1993" x2="850" y2="1993" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1983" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="2081" x2="590" y2="2081" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2071" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2169" x2="330" y2="2169" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2159" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2257" x2="90" y2="2257" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2247" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><path d="M1130 2377h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2350" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">12. Find primaryRole from assigned</tspan><tspan x="1265" dy="17">userRoles</tspan></text><path d="M1130 2650h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2606" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">13. Result: reviewRequired 