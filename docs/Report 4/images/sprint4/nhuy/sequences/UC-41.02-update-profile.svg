 Verify jwt</tspan></text><rect x="35" y="657" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 685h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="676" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="679" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="919" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 947h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="938" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="941" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1035" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1063h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1054" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1057" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1915" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1943h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1934" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1937" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user or profile missing]</tspan></text><rect x="35" y="2495" width="2040" height="95" fill="none" stroke="#111"/><path d="M35 2523h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2514" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="2517" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">ProfileRevisionService.submitGeneral: choose CLIENT/FREELANCER revision; ProfileRevisionRepository reads snapshot and creates/updates PENDING revision in transaction; live</tspan><tspa