le" font-size="13"><tspan x="1280" dy="0">20. findGeneralProfile(userId)</tspan></text><line x1="1430" y1="3521" x2="1730" y2="3521" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3477" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">21. user.findFirst(id; deletedAt null;</tspan><tspan x="1580" dy="17">select email, profile, roles by createdAt</tspan><tspan x="1580" dy="17">asc)</tspan></text><line x1="1730" y1="3610" x2="1990" y2="3610" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3583" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">22. SELECT active user profile, email</tspan><tspan x="1860" dy="17">and assigned roles</tspan></text><line x1="1990" y1="3698" x2="1730" y2="3698" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3688" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">23. User or null</tspan></text><line x1="1730" y1="3786" x2="1430" y2="3786" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3776" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">24. User or null</tspan></text><line x1="1430" y1="3874" x2="1130" y2="3874" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3864" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">25. User or null</tspan></text><line x1="1130" y1="4016" x2="850" y2="4016" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="4006" text-anchor="middle" font-size="13"><tspan x="990" dy="0">26.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="4104" x2="590" y2="4104" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="4094" text-anchor="middle" font-size="13"><tspan x="720" dy="0">26.2. Propagate HTTP error</tspan></text><line x1="590" y1="4192" x2="330" y2="4192" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="4182" text-anchor="middle" font-size="13"><tspan x=