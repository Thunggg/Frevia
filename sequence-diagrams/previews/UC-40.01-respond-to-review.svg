" height="226" fill="none" stroke="#111"/><path d="M35 685h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="676" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="679" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="919" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 947h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="938" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="941" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1035" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1063h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1054" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1057" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1914" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1942h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1933" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1936" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[review missing or soft-deleted]</tspan></text><rect x="35" y="2352" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2380h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2371" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2374" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[review.revieweeId != userId]</tspan></text><rect x="35" y="3319" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 3347h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3338" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="3341" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[existing response is not soft-deleted]</tspan></text><rect x="35" y="3845" width="2040" height="1185" fill="none" stroke="#111"/><path d="M35 3873h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3864" text-anchor="middle" font-size="13"><tspan x="68" dy="0">alt</tspan></text><text x="1090" y="3867" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[existing response is soft-deleted]</tspan></text><rect x="35" y="5066" width="2040" height="85" fill="none" stroke="#111"/><path d="M35 5094h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="5085" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="5088" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">On Prisma P2002 in createResponse: rollback; return 409 ReviewResponseAlreadyExistsException; other errors propagate</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Enter response text; Submit</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST /reviews/:reviewId/response</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="477" x2="850" y2="477" stroke="#111"  marker-end="url(#call)"/><text x="720" y="450" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. respond(userId, reviewId,</tspan><tspan x="720" dy="17">responseText)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1113" x2="330" y2="1113" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1103" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1201" x2="90" y2="1201" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1191" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1321" x2="1130" y2="1321" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1294" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. respond(userId, reviewId,</tspan><tspan x="990" dy="17">responseText)</tspan></text><line x1="1130" y1="1409" x2="1430" y2="1409" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1399" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findById(reviewId)</tspan></text><line x1="1430" y1="1497" x2="1730" y2="1497" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1453" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. review.findFirst(id; deletedAt null;</tspan><tspan x="1580" dy="17">select review, reviewer, reviewee,</tspan><tspan x="1580" dy="17">response)</tspan></text><line x1="1730" y1="1586" x2="1990" y2="1586" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1559" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active Review with parties</tspan><tspan x="1860" dy="17">and response</tspan></text><line x1="1990" y1="1674" x2="1730" y2="1674" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1664" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Review or null</tspan></text><line x1="1730" y1="1762" x2="1430" y2="1762" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1752" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Review or null</tspan></text><line x1="1430" y1="1850" x2="1130" y2="1850" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1840" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Review or null</tspan></text><line x1="1130" y1="1992" x2="850" y2="1992" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1982" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ReviewNotFoundException</tspan></text><line x1="850" y1="2080" x2="590" y2="2080" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2070" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2168" x2="330" y2="2168" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2158" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2256" x2="90" y2="2256" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2246" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2430" x2="850" y2="2430" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2420" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 ReviewForbiddenException</tspan></text><line x1="850" y1="2518" x2="590" y2="2518" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2508" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2606" x2="330" y2="2606" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2596" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2694" x2="90" y2="2694" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2684" text-anchor="middle" font-size="13"><tspan x="210" dy="0">12.4. Display error message</tspan></text><line x1="1130" y1="2814" x2="1430" y2="2814" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2804" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">13. findResponseByReview(reviewId)</tspan></text><line x1="1430" y1="2902" x2="1730" y2="2902" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2875" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">14. reviewResponse.findUnique(reviewId;</tspan><tspan x="1580" dy="17">select id, deletedAt)</tspan></text><line x1="1730" y1="2991" x2="1990" y2="2991" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2964" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. SELECT response including</tspan><tspan x="1860" dy="17">soft-deleted record</tspan></text><line x1="1990" y1="3079" x2="1730" y2="3079" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3069" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. Existing response or null</tspan></text><line x1="1730" y1="3167" x2="1430" y2="3167" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3157" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">17. Existing response or null</tspan></text><line x1="1430" y1="3255" x2="1130" y2="3255" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3245" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">18. Existing response or null</tspan></text><line x1="1130" y1="3397" x2="850" y2="3397" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3370" text-anchor="middle" font-size="13"><tspan x="990" dy="0">19.1. 409</tspan><tspan x="990" dy="17">ReviewResponseAlreadyExistsException</tspan></text><line x1="850" y1="3485" x2="590" y2="3485" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3475" text-anchor="middle" font-size="13"><tspan x="720" dy="0">19.2. Propagate HTTP error</tspan></text><line x1="590" y1="3573" x2="330" y2="3573" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3563" text-anchor="middle" font-size="13"><tspan x="460" dy="0">19.3. Return error response</tspan></text><line x1="330" y1="3661" x2="90" y2="3661" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3651" text-anchor="middle" font-size="13"><tspan x="210" dy="0">19.4. Display error message</tspan></text><path d="M1130 3781h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="3754" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">20. Resolve responder displayName or</tspan><tspan x="1265" dy="17">CONTRACT_PARTICIPANT fallback</tspan></text><line x1="1130" y1="3923" x2="1430" y2="3923" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3896" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">21. createResponse(...,</tspan><tspan x="1280" dy="17">existingResponse.id)</tspan></text><line x1="1430" y1="4011" x2="1730" y2="4011" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3967" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">22. $transaction:</tspan><tspan x="1580" dy="17">reviewResponse.update(deletedAt null,</tspan><tspan x="1580" dy="17">userId, responseText); notification.create</tspan></text><line x1="1730" y1="4117" x2="1990" y2="4117" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="4073" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">23. RESTORE response; INSERT</tspan><tspan x="1860" dy="17">REVIEW_RESPONSE_RECEIVED notification</tspan><tspan x="1860" dy="17">for reviewer; COMMIT</tspan></text><line x1="1990" y1="4206" x2="1730" y2="4206" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="4179" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">24. Restored response with responder</tspan><tspan x="1860" dy="17">profile</tspan></text><line x1="1730" y1="4294" x2="1430" y2="4294" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="4267" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">25. Restored response with responder</tspan><tspan x="1580" dy="17">profile</tspan></text><line x1="1430" y1="4382" x2="1130" y2="4382" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="4355" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">26. Restored response with responder</tspan><tspan x="1280" dy="17">profile</tspan></text><line x1="1130" y1="4528" x2="1430" y2="4528" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="4501" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">27. createResponse(..., no</tspan><tspan x="1280" dy="17">deletedResponseId)</tspan></text><line x1="1430" y1="4616" x2="1730" y2="4616" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="4589" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">28. $transaction: reviewResponse.create;</tspan><tspan x="1580" dy="17">notification.create</tspan></text><line x1="1730" y1="4705" x2="1990" y2="4705" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="4661" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">29. INSERT response; INSERT</tspan><tspan x="1860" dy="17">REVIEW_RESPONSE_RECEIVED notification</tspan><tspan x="1860" dy="17">for reviewer; COMMIT</tspan></text><line x1="1990" y1="4794" x2="1730" y2="4794" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="4767" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">30. Created response with responder</tspan><tspan x="1860" dy="17">profile</tspan></text><line x1="1730" y1="4882" x2="1430" y2="4882" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="4855" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">31. Created response with responder</tspan><tspan x="1580" dy="17">profile</tspan></text><line x1="1430" y1="4970" x2="1130" y2="4970" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="4943" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">32. Created response with responder</tspan><tspan x="1280" dy="17">profile</tspan></text><line x1="1130" y1="5211" x2="850" y2="5211" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="5201" text-anchor="middle" font-size="13"><tspan x="990" dy="0">33. ReviewResponseDto</tspan></text><line x1="850" y1="5299" x2="590" y2="5299" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="5289" text-anchor="middle" font-size="13"><tspan x="720" dy="0">34. Return controller result</tspan></text><line x1="590" y1="5387" x2="330" y2="5387" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="5377" text-anchor="middle" font-size="13"><tspan x="460" dy="0">35. 201 Created: ReviewResponseDto</tspan></text><line x1="330" y1="5475" x2="90" y2="5475" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="5465" text-anchor="middle" font-size="13"><tspan x="210" dy="0">36. Display response to review</tspan></text><line x1="35" y1="4458" x2="2075" y2="4458" stroke="#111" stroke-dasharray="7 5"/><text x="1055" y="4480" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">[else: no existing response]</tspan></text></g></svg>
