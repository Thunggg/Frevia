<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="4441" viewBox="0 0 2110 4441"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-19.02 — Update Company Information</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Client</tspan></text><line x1="90" y1="280" x2="90" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ClientProfileView</tspan></text><line x1="330" y1="225" x2="330" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="4009" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ClientProfileRoute</tspan></text><line x1="590" y1="225" x2="590" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="3997" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ClientProfileController</tspan></text><line x1="850" y1="225" x2="850" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="3985" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:AccountProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="3973" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:AccountProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="3961" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="3949" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="4401" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="3937" fill="white" stroke="#111"/><rect x="35" y="541" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 569h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="560" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="563" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="657" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 685h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="676" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="679" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="919" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 947h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="938" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="941" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1035" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1063h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1054" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1057" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1914" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1942h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1933" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1936" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user or profile missing]</tspan></text><rect x="35" y="2352" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2380h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2371" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2374" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user lacks CLIENT role]</tspan></text><rect x="35" y="2932" width="2040" height="105" fill="none" stroke="#111"/><path d="M35 2960h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2951" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="2954" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">ProfileRevisionService.submitClient: ProfileRevisionRepository reads snapshot and creates / updates latest PENDING CLIENT revision in transaction; live company information</tspan><tspan x="1090" dy="17">unchanged</tspan></text><rect x="35" y="2878" width="2040" height="1041" fill="none" stroke="#111"/><path d="M35 2906h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2897" text-anchor="middle" font-size="13"><tspan x="68" dy="0">alt</tspan></text><text x="1090" y="2900" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile strength &lt; 20]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="256" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Edit companyName,</tspan><tspan x="210" dy="17">companyDescription and website;</tspan><tspan x="210" dy="17">Save</tspan></text><line x1="330" y1="389" x2="590" y2="389" stroke="#111"  marker-end="url(#call)"/><text x="460" y="362" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. PUT /clients/me/profile</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="477" x2="850" y2="477" stroke="#111"  marker-end="url(#call)"/><text x="720" y="450" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. update(userId, body) -&gt;</tspan><tspan x="720" dy="17">updateClientProfile(userId, input)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1113" x2="330" y2="1113" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1103" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1201" x2="90" y2="1201" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1191" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1321" x2="1130" y2="1321" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1294" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. update(userId, body) -&gt;</tspan><tspan x="990" dy="17">updateClientProfile(userId, input)</tspan></text><line x1="1130" y1="1409" x2="1430" y2="1409" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1382" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. requireRole(userId):</tspan><tspan x="1280" dy="17">findUserWithRoles(userId)</tspan></text><line x1="1430" y1="1497" x2="1730" y2="1497" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1470" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. user.findFirst(id: userId; deletedAt:</tspan><tspan x="1580" dy="17">null; include roles, profile)</tspan></text><line x1="1730" y1="1586" x2="1990" y2="1586" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1559" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active User + Profile +</tspan><tspan x="1860" dy="17">roles</tspan></text><line x1="1990" y1="1674" x2="1730" y2="1674" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1664" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. User with roles or null</tspan></text><line x1="1730" y1="1762" x2="1430" y2="1762" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1752" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. User with roles or null</tspan></text><line x1="1430" y1="1850" x2="1130" y2="1850" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1840" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. User with roles or null</tspan></text><line x1="1130" y1="1992" x2="850" y2="1992" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1982" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="2080" x2="590" y2="2080" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2070" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2168" x2="330" y2="2168" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2158" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2256" x2="90" y2="2256" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2246" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2430" x2="850" y2="2430" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2403" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403</tspan><tspan x="990" dy="17">AccountProfileForbiddenException</tspan></text><line x1="850" y1="2518" x2="590" y2="2518" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2508" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2606" x2="330" y2="2606" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2596" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2694" x2="90" y2="2694" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2684" text-anchor="middle" font-size="13"><tspan x="210" dy="0">12.4. Display error message</tspan></text><path d="M1130 2814h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2787" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">13. Read profileCompletionPercent;</tspan><tspan x="1265" dy="17">ProfileRevisionService.requiresManualReview(strength)</tspan></text><path d="M1130 3097h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="3070" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">14. Build result: reviewRequired true,</tspan><tspan x="1265" dy="17">revision, original profileStrength</tspan></text><line x1="1130" y1="3243" x2="1430" y2="3243" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3233" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">15. updateClientProfile(userId, input)</tspan></text><line x1="1430" y1="3331" x2="1730" y2="3331" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3253" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">16. $transaction:</tspan><tspan x="1580" dy="17">profile.findUniqueOrThrow;</tspan><tspan x="1580" dy="17">calculateClientProfileStrength;</tspan><tspan x="1580" dy="17">profile.update; clientProfile.upsert;</tspan><tspan x="1580" dy="17">profile.findUniqueOrThrow</tspan></text><line x1="1730" y1="3471" x2="1990" y2="3471" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3427" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">17. SELECT Profile; UPDATE completion</tspan><tspan x="1860" dy="17">percent; UPSERT ClientProfile; SELECT</tspan><tspan x="1860" dy="17">updated profile; COMMIT</tspan></text><line x1="1990" y1="3577" x2="1730" y2="3577" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3550" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">18. Updated profile with completion</tspan><tspan x="1860" dy="17">percent</tspan></text><line x1="1730" y1="3665" x2="1430" y2="3665" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3638" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">19. Updated profile with completion</tspan><tspan x="1580" dy="17">percent</tspan></text><line x1="1430" y1="3753" x2="1130" y2="3753" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3726" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">20. Updated profile with completion</tspan><tspan x="1280" dy="17">percent</tspan></text><path d="M1130 3841h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="3780" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">21.</tspan><tspan x="1265" dy="17">ProfileRevisionService.directUpdateResult:</tspan><tspan x="1265" dy="17">reviewRequired false, revision null,</tspan><tspan x="1265" dy="17">updated profileStrength</tspan></text><line x1="1130" y1="3979" x2="850" y2="3979" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3969" text-anchor="middle" font-size="13"><tspan x="990" dy="0">22. ProfileRevisionSubmissionDto</tspan></text><line x1="850" y1="4067" x2="590" y2="4067" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="4057" text-anchor="middle" font-size="13"><tspan x="720" dy="0">23. Return controller result</tspan></text><line x1="590" y1="4155" x2="330" y2="4155" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="4128" text-anchor="middle" font-size="13"><tspan x="460" dy="0">24. 200 OK:</tspan><tspan x="460" dy="17">ProfileRevisionSubmissionDto</tspan></text><line x1="330" y1="4243" x2="90" y2="4243" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="4216" text-anchor="middle" font-size="13"><tspan x="210" dy="0">25. Show server submitted /</tspan><tspan x="210" dy="17">updated message</tspan></text><line x1="35" y1="3173" x2="2075" y2="3173" stroke="#111" stroke-dasharray="7 5"/><text x="1055" y="3195" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">[else: profile strength &gt;= 20]</tspan></text></g></svg>
