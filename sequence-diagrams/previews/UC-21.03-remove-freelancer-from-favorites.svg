rify jwt</tspan></text><rect x="35" y="657" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 685h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="676" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="679" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="919" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 947h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="938" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="941" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1653" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1681h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1672" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1675" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user or profile missing]</tspan></text><rect x="35" y="2091" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2119h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2110" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2113" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[user lacks CLIENT role]</tspan></text><rect x="35" y="3057" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 3085h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3076" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="3079" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[favorite missing]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Click remove favorite</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="361" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. DELETE</tspan><tspan x="460" dy="17">/favorites/freelancers/:freelancerId</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="449" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. remove(userId, freelancerId) -&gt;</tspan><tspan x="720" dy="17">removeFavorite(userId, freelancerId)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1059" x2="1130" y2="1059" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1032" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. remove(userId, freelancerId) -&gt;</tspan><tspan x="990" dy="17">removeFavorite(userId, freelancerId)</tspan></text><line x1="1130" y1="1148" x2="1430" y2="1148" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1121" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. requireRole(userId):</tspan><tspan x="1280" dy="17">findUserWithRoles(userId)</tspan></text><line x1="1430" y1="1236" x2="1730" y2="1236" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1209" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. user.findFirst(id: userId; deletedAt:</tspan><tspan x="1580" dy="17">null; include roles, profile)</tspan></text><line x1="1730" y1="1325" x2="1990" y2="1325" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1298" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active User + Profile +</tspan><tspan x="1860" dy="17">roles</tspan></text><line x1="1990" y1="1413" x2="1730" y2="1413" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1403" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. User with roles or null</tspan></text><line x1="1730" y1="1501" x2="1430" y2="1501" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1491" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. User with roles or null</tspan></text><line x1="1430" y1="1589" x2="1130" y2="1589" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1579" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. User with roles or null</tspan></text><line x1="1130" y1="1731" x2="850" y2="1731" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1721" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="1819" x2="590" y2="1819" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1809" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1907" x2="330" y2="1907" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1897" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1995" x2="90" y2="1995" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1985" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2169" x2="850" y2="2169" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2142" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403</tspan>