<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="3226" viewBox="0 0 2110 3226"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-08.01 — View Freelancer Skill List</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Public endpoint (@IsPublic) • no JWT required • return arrows are dashed</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Visitor / Freelancer</tspan></text><line x1="90" y1="280" x2="90" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ProfileView</tspan></text><line x1="330" y1="225" x2="330" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="2794" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ProfileRoute</tspan></text><line x1="590" y1="225" x2="590" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="2782" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ProfileController</tspan></text><line x1="850" y1="225" x2="850" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="2770" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:ProfileService</tspan></text><line x1="1130" y1="225" x2="1130" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="2758" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:ProfileRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="2746" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="2734" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="3186" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="2722" fill="white" stroke="#111"/><rect x="35" y="1157" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1185h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1176" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1179" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile missing OR user has no FREELANCER role]</tspan></text><rect x="35" y="2124" width="2040" height="580" fill="none" stroke="#111"/><path d="M35 2152h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2143" text-anchor="middle" font-size="13"><tspan x="68" dy="0">opt</tspan></text><text x="1090" y="2146" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[FreelancerProfile exists]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open profile skills section</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /profiles/:id/skills</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. getSkills(id)</tspan></text><line x1="850" y1="564" x2="1130" y2="564" stroke="#111"  marker-end="url(#call)"/><text x="990" y="554" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. getSkills(id)</tspan></text><line x1="1130" y1="652" x2="1430" y2="652" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="642" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findFreelancerProfileById(profileId)</tspan></text><line x1="1430" y1="740" x2="1730" y2="740" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="713" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(id); fallback</tspan><tspan x="1580" dy="17">findFirst(userId)</tspan></text><line x1="1730" y1="828" x2="1990" y2="828" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="801" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT Profile + FreelancerProfile</tspan><tspan x="1860" dy="17">+ User roles; user.deletedAt IS NULL</tspan></text><line x1="1990" y1="917" x2="1730" y2="917" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="907" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1005" x2="1430" y2="1005" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="995" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1093" x2="1130" y2="1093" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1083" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Profile or null</tspan></text><line x1="1130" y1="1235" x2="850" y2="1235" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1208" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">FreelancerProfileNotFoundException</tspan></text><line x1="850" y1="1323" x2="590" y2="1323" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1313" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1411" x2="330" y2="1411" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1401" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1499" x2="90" y2="1499" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1489" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="1619" x2="1430" y2="1619" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1609" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">12. findSkillsByProfileId(profileId)</tspan></text><line x1="1430" y1="1707" x2="1730" y2="1707" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1663" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">13.</tspan><tspan x="1580" dy="17">freelancerProfile.findUnique(profileId);</tspan><tspan x="1580" dy="17">fallback findFirst(userId)</tspan></text><line x1="1730" y1="1796" x2="1990" y2="1796" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1769" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">14. SELECT FreelancerProfile; if</tspan><tspan x="1860" dy="17">absent return []</tspan></text><line x1="1990" y1="1884" x2="1730" y2="1884" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1874" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. FreelancerProfile or null</tspan></text><line x1="1730" y1="1972" x2="1430" y2="1972" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1962" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">16. FreelancerProfile or null</tspan></text><line x1="1430" y1="2060" x2="1130" y2="2060" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2050" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">17. FreelancerProfile or null</tspan></text><line x1="1130" y1="2202" x2="1430" y2="2202" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2175" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">18. Continue</tspan><tspan x="1280" dy="17">findSkillsByProfileId(profileId)</tspan></text><line x1="1430" y1="2290" x2="1730" y2="2290" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2263" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">19. freelancerSkill.findMany(include</tspan><tspan x="1580" dy="17">skill; orderBy skill.name asc)</tspan></text><line x1="1730" y1="2379" x2="1990" y2="2379" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2335" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">20. SELECT skills WHERE</tspan><tspan x="1860" dy="17">freelancerProfileId AND</tspan><tspan x="1860" dy="17">skill.deletedAt IS NULL</tspan></text><line x1="1990" y1="2468" x2="1730" y2="2468" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="2458" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">21. FreelancerSkill[]</tspan></text><line x1="1730" y1="2556" x2="1430" y2="2556" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="2546" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">22. FreelancerSkill[]</tspan></text><line x1="1430" y1="2644" x2="1130" y2="2644" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2634" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">23. FreelancerSkill[]</tspan></text><line x1="1130" y1="2764" x2="850" y2="2764" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2754" text-anchor="middle" font-size="13"><tspan x="990" dy="0">24. FreelancerSkill[] (possibly empty)</tspan></text><line x1="850" y1="2852" x2="590" y2="2852" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2842" text-anchor="middle" font-size="13"><tspan x="720" dy="0">25. Return controller result</tspan></text><line x1="590" y1="2940" x2="330" y2="2940" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2913" text-anchor="middle" font-size="13"><tspan x="460" dy="0">26. 200 OK: FreelancerSkill[]</tspan><tspan x="460" dy="17">(possibly empty)</tspan></text><line x1="330" y1="3028" x2="90" y2="3028" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3001" text-anchor="middle" font-size="13"><tspan x="210" dy="0">27. Display skill list or empty</tspan><tspan x="210" dy="17">state</tspan></text></g></svg>
