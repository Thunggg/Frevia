nt-size="13"><tspan x="720" dy="0">20. Return controller result</tspan></text><line x1="590" y1="3256" x2="330" y2="3256" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3229" text-anchor="middle" font-size="13"><tspan x="460" dy="0">21. 200 OK: { message:</tspan><tspan x="460" dy="17">ReviewMessage.RESPONSE_DELETED }</tspan></text><line x1="330" y1="3344" x2="90" y2="3344" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3334" text-anchor="middle" font-size="13"><tspan x="210" dy="0">22. Hide deleted response</tspan></text></g></svg>
