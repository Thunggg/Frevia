-anchor="middle" font-size="13"><tspan x="720" dy="0">3. removeResponse(userId, responseId)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1048" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. removeResponse(userId, responseId)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findResponseById(responseId)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1207" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. reviewResponse.findFirst(id; deletedAt</tspan><tspan x="1580" dy="17">null; select id, reviewId, userId)</tspan></text><line x1="1730" y1="1323" x2="1990" y2="1323" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1313" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active review response</tspan></text><line x1="1990" y1="1411" x2="1730" y2="1411" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1401" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Response or null</tspan></text><line x1="1730" y1="1499" x2="1430" y2="1499" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1489" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Response or null</tspan></text><line x1="1430" y1="1587" x2="1130" y2="1587" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1577" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Response or null</tspan></text><line x1="1130" y1="1729" x2="850" y2="1729" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1702" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">ReviewResponseNotFoundException</tspan></text><line x1="850" y1="1817" x2="590" y2="1817" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1807" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1905" x2="330" y2="1905" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1895" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1993" x2="90" y2="1993" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1983" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2167" x2="850" y2="2167" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2157" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 ReviewForbiddenException</tspan></text><line x1="850" y1="2255" x2="590" y2="2255" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2245" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2343" x2="330" y2="2343" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2333" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2431" x2="90" y2="2431" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><