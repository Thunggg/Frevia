</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="344" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. PATCH</tspan><tspan x="460" dy="17">/reviews/responses/:responseId</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="477" x2="850" y2="477" stroke="#111"  marker-end="url(#call)"/><text x="720" y="450" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. updateResponse(userId, responseId,</tspan><tspan x="720" dy="17">responseText)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1113" x2="330" y2="1113" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1103" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1201" x2="90" y2="1201" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1191" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1321" x2="1130" y2="1321" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1294" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. updateResponse(userId, responseId,</tspan><tspan x="990" dy="17">responseText)</tspan></text><line x1="1130" y1="1409" x2="1430" y2="1409" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1399" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findResponseById(responseId)</tspan><