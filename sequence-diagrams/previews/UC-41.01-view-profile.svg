ror response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1031" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. get(userId) -&gt;</tspan><tspan x="990" dy="17">getGeneralProfile(userId)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findGeneralProfile(userId)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1190" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. user.findFirst(id; deletedAt null;</tspan><tspan x="1580" dy="17">select email, profile, roles by createdAt</tspan><tspan x="1580" dy="17">asc)</tspan></text><line x1="1730" y1="1323" x2="1990" y2="1323" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1296" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active user profile, email</tspan><tspan x="1860" dy="17">and assigned roles</tspan></text><line x1="1990" y1="1411" x2="1730" y2="1411" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1401" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. User or null</tspan></text><line x1="1730" y1="1499" x2="1430" y2="1499" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1489" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. User or null</tspan></text><line x1="1430" y1="1587" x2="1130" y2="1587" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1577" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. User or null</tspan></text><line x1="1130" y1="1729" x2="850" y2="1729" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1719" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 ProfileNotFoundException</tspan></text><line x1="850" y1="1817" x2="590" y2="1817" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1807" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1905" x2="330" y2="1905" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1895" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1993" x2="90" y2="1993" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1983" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><path d="M1130 2113h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2069" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">12. presentGeneralProfile: include</tspan><tspan x="1265" dy="17">email and roles; present local avatar</tspan><tspan x="1265" dy="17">URL with updatedAt version</tspan></text><line x1="1130" y1="2202" x2="850" y2="2202" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2192" text-anchor="middle" font-size="13"><tspan x="990" dy="0">13. GeneralProfileDto</tspan></text><line x1="850" y1="2290" x2="590" y2="2290" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2280" text-anchor="middle" font-size="13"><tspan x="720" dy="0">14. Return controller result</tspan></text><line x1="590" y1="2378" x2="330" y2="2378" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2368" text-anchor="middle" font-size="13"><tspan x="460" dy="0">15. 200 OK: GeneralProfileDto</tspan></text><line x1="330" y1="2466" x2="90" y2="2466" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2439" text-anchor="middle" font-size="13"><tspan x="210" dy="0">16. Display current user profile,</tspan><tspan x="210" dy="17">email, avatar and roles</tspan></text></g></svg>
