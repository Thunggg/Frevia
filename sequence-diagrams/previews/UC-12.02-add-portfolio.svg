anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="3712" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">On non-HttpException in PortfolioService: 500 UnableToLoadPortfoliosException; existing HttpException is rethrown</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="256" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open Add Portfolio; enter</tspan><tspan x="210" dy="17">title, description, technologies,</tspan><tspan x="210" dy="17">URL; Save</tspan></text><line x1="330" y1="389" x2="590" y2="389" stroke="#111"  marker-end="url(#call)"/><text x="460" y="362" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST /profiles/:id/portfolios</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="477" x2="850" y2="477" stroke="#111"  marker-end="url(#call)"/><text x="720" y="450" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. addPortfolio(id, currentUserId,</tspan><tspan x="720" dy="17">body)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1113" x2="330" y2="1113" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1103" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1201" x2="90" y2="1201" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1191" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1321" x2="1130" y2="1321" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1311" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. addPortfolio(id, currentUserId, body)</tspan></text><line x1="1130" y1="1409" x2="1430" y2="1409" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1399" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findFreelancerProfileById(profileId)</tspan></text><line x1="1430" y1="1497" x2="1730" y2="1497" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1487" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(id OR userId)</tspan></text><line x1="1730" y1="1585" x2="1990" y2="1585" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1558" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT Profile + FreelancerProfile</tspan><tspan x="1860" dy="17">+ User roles; user.deletedAt IS NULL</tspan></text><line x1="1990" y1="1674" x2="1730" y2="1674" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1664" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1762" x2="1430" y2="1762" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1752" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1850" x2="1130" y2="1850" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1840" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Profile or null</tspan></text><line x1="1130" y1="1992" x2="850" y2="1992" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1965" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">FreelancerProfileNotFoundException</tspan></text><line x1="850" y1="2080" x2="590" y2="20