pan x="1580" dy="17">freelancerProfile.findUnique; create if</tspan><tspan x="1580" dy="17">absent; portfolioItem.create</tspan></text><line x1="1730" y1="3009" x2="1990" y2="3009" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2982" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. INSERT FreelancerProfile if</tspan><tspan x="1860" dy="17">absent; INSERT PortfolioItem; COMMIT</tspan></text><line x1="1990" y1="3098" x2="1730" y2="3098" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3088" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. Created PortfolioItem</tspan></text><line x1="1730" y1="3186" x2="1430" y2="3186" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3176" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">17. Created PortfolioItem</tspan></text><line x1="1430" y1="3274" x2="1130" y2="3274" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3264" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">18. Created PortfolioItem</tspan></text><line x1="1130" y1="3362" x2="850" y2="3362" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3352" text-anchor="middle" font-size="13"><tspan x="990" dy="0">19. AddPortfolioResponseDto</tspan></text><line x1="850" y1="3450" x2="590" y2="3450" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3440" text-anchor="middle" font-size="13"><tspan x="720" dy="0">20. Return controller result</tspan></text><line x1="590" y1="3538" x2="330" y2="3538" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3511" text-anchor="middle" font-size="13"><tspan x="460" dy="0">21. 201 Created:</tspan><tspan x="460" dy="17">AddPortfolioResponseDto</tspan></text><line x1="330" y1="3626" x2="90" y2="3626" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3599" text-anchor="middle" font-size="13"><tspan x="210" dy="0">22. Prepend portfolio to local</tspan><tspan x="210" dy="17">list; close editor; show success</tspan></text></g></svg>
