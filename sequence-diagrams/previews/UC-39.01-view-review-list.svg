06" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Contract or null</tspan></text><line x1="1430" y1="1604" x2="1130" y2="1604" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1594" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Contract or null</tspan></text><line x1="1130" y1="1746" x2="850" y2="1746" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1719" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">ReviewContractNotFoundException</tspan></text><line x1="850" y1="1834" x2="590" y2="1834" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1824" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1922" x2="330" y2="1922" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1912" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2010" x2="90" y2="2010" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2000" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2184" x2="850" y2="2184" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2174" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 ReviewForbiddenException</tspan></text><line x1="850" y1="2272" x2="590" y2="2272" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2262" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2360" x2="330" y2="2360" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2350" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y