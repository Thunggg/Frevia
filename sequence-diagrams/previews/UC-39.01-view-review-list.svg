 height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1668" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1696h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1687" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1690" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[contract missing]</tspan></text><rect x="35" y="2106" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2134h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2125" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2128" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[userId is neither clientId nor freelancerId]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open reviews for a contract</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /reviews/contracts/:contractId</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-siz