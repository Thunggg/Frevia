<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="5528" viewBox="0 0 2110 5528"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-39.03 — Write Review</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Authenticated User</tspan></text><line x1="90" y1="280" x2="90" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:ReviewView</tspan></text><line x1="330" y1="225" x2="330" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="5096" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:ReviewRoute</tspan></text><line x1="590" y1="225" x2="590" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="5084" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:ReviewController</tspan></text><line x1="850" y1="225" x2="850" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="5072" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:ReviewService</tspan></text><line x1="1130" y1="225" x2="1130" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="5060" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:ReviewRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="5048" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="5036" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="5488" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="5024" fill="white" stroke="#111"/><rect x="35" y="541" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 569h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="560" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="563" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="657" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 685h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="676" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="679" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="919" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 947h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="938" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="941" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1035" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 1063h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1054" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1057" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[request DTO / id validation fails]</tspan></text><rect x="35" y="1931" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1959h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1950" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1953" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[contract missing]</tspan></text><rect x="35" y="2369" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2397h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2388" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2391" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[userId is neither clientId nor freelancerId]</tspan></text><rect x="35" y="2807" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 2835h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2826" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="2829" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[contract.status != COMPLETED]</tspan></text><rect x="35" y="3775" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 3803h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="3794" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="3797" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[review already exists, including soft-deleted]</tspan></text><rect x="35" y="4832" width="2040" height="85" fill="none" stroke="#111"/><path d="M35 4860h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="4851" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="4854" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">On Prisma P2002 in create: transaction rolls back; return 409 ReviewAlreadyExistsException</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="273" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Enter overallRating, optional</tspan><tspan x="210" dy="17">breakdown and comment; Submit</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="344" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. POST</tspan><tspan x="460" dy="17">/reviews/contracts/:contractId</tspan><tspan x="460" dy="17">(body)</tspan></text><line x1="590" y1="477" x2="850" y2="477" stroke="#111"  marker-end="url(#call)"/><text x="720" y="467" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. create(userId, contractId, input)</tspan></text><line x1="590" y1="735" x2="330" y2="735" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="725" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="823" x2="90" y2="823" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="796" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="590" y1="1113" x2="330" y2="1113" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1103" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.3.1. 400 validation error</tspan></text><line x1="330" y1="1201" x2="90" y2="1201" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1191" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.3.2. Display validation message</tspan></text><line x1="850" y1="1321" x2="1130" y2="1321" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1311" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. create(userId, contractId, input)</tspan></text><line x1="1130" y1="1409" x2="1430" y2="1409" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1382" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. requireContractParticipant:</tspan><tspan x="1280" dy="17">findContract(contractId)</tspan></text><line x1="1430" y1="1497" x2="1730" y2="1497" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1453" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. contract.findFirst(id; deletedAt null;</tspan><tspan x="1580" dy="17">select participants, status, display</tspan><tspan x="1580" dy="17">names)</tspan></text><line x1="1730" y1="1603" x2="1990" y2="1603" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1576" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active contract and</tspan><tspan x="1860" dy="17">participants</tspan></text><line x1="1990" y1="1691" x2="1730" y2="1691" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1681" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Contract or null</tspan></text><line x1="1730" y1="1779" x2="1430" y2="1779" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1769" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Contract or null</tspan></text><line x1="1430" y1="1867" x2="1130" y2="1867" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1857" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Contract or null</tspan></text><line x1="1130" y1="2009" x2="850" y2="2009" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1982" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">ReviewContractNotFoundException</tspan></text><line x1="850" y1="2097" x2="590" y2="2097" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2087" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="2185" x2="330" y2="2185" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2175" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="2273" x2="90" y2="2273" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2263" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="2447" x2="850" y2="2447" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2437" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12.1. 403 ReviewForbiddenException</tspan></text><line x1="850" y1="2535" x2="590" y2="2535" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2525" text-anchor="middle" font-size="13"><tspan x="720" dy="0">12.2. Propagate HTTP error</tspan></text><line x1="590" y1="2623" x2="330" y2="2623" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="2613" text-anchor="middle" font-size="13"><tspan x="460" dy="0">12.3. Return error response</tspan></text><line x1="330" y1="2711" x2="90" y2="2711" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="2701" text-anchor="middle" font-size="13"><tspan x="210" dy="0">12.4. Display error message</tspan></text><line x1="1130" y1="2885" x2="850" y2="2885" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2858" text-anchor="middle" font-size="13"><tspan x="990" dy="0">13.1. 400</tspan><tspan x="990" dy="17">ReviewContractNotCompletedException</tspan></text><line x1="850" y1="2973" x2="590" y2="2973" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2963" text-anchor="middle" font-size="13"><tspan x="720" dy="0">13.2. Propagate HTTP error</tspan></text><line x1="590" y1="3061" x2="330" y2="3061" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3051" text-anchor="middle" font-size="13"><tspan x="460" dy="0">13.3. Return error response</tspan></text><line x1="330" y1="3149" x2="90" y2="3149" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3139" text-anchor="middle" font-size="13"><tspan x="210" dy="0">13.4. Display error message</tspan></text><line x1="1130" y1="3269" x2="1430" y2="3269" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="3242" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">14. findByContractAndReviewer(contractId,</tspan><tspan x="1280" dy="17">userId)</tspan></text><line x1="1430" y1="3358" x2="1730" y2="3358" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="3314" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">15.</tspan><tspan x="1580" dy="17">review.findUnique(contractId_reviewerId;</tspan><tspan x="1580" dy="17">including deleted review)</tspan></text><line x1="1730" y1="3447" x2="1990" y2="3447" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="3420" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. SELECT review id for this</tspan><tspan x="1860" dy="17">contract and reviewer</tspan></text><line x1="1990" y1="3535" x2="1730" y2="3535" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="3525" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">17. Review id or null</tspan></text><line x1="1730" y1="3623" x2="1430" y2="3623" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="3613" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">18. Review id or null</tspan></text><line x1="1430" y1="3711" x2="1130" y2="3711" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="3701" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">19. Review id or null</tspan></text><line x1="1130" y1="3853" x2="850" y2="3853" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="3843" text-anchor="middle" font-size="13"><tspan x="990" dy="0">20.1. 409 ReviewAlreadyExistsException</tspan></text><line x1="850" y1="3941" x2="590" y2="3941" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="3931" text-anchor="middle" font-size="13"><tspan x="720" dy="0">20.2. Propagate HTTP error</tspan></text><line x1="590" y1="4029" x2="330" y2="4029" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="4019" text-anchor="middle" font-size="13"><tspan x="460" dy="0">20.3. Return error response</tspan></text><line x1="330" y1="4117" x2="90" y2="4117" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="4107" text-anchor="middle" font-size="13"><tspan x="210" dy="0">20.4. Display error message</tspan></text><path d="M1130 4237h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="4193" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">21. Choose the other participant as</tspan><tspan x="1265" dy="17">reviewee; use reviewer displayName or</tspan><tspan x="1265" dy="17">fallback</tspan></text><line x1="1130" y1="4326" x2="1430" y2="4326" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="4299" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">22. create(contractId, userId, revieweeId,</tspan><tspan x="1280" dy="17">reviewerName, input)</tspan></text><line x1="1430" y1="4414" x2="1730" y2="4414" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="4370" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">23. $transaction:</tspan><tspan x="1580" dy="17">review.create(reviewSelect);</tspan><tspan x="1580" dy="17">notification.create</tspan></text><line x1="1730" y1="4503" x2="1990" y2="4503" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="4459" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">24. INSERT Review; INSERT</tspan><tspan x="1860" dy="17">REVIEW_RECEIVED notification for</tspan><tspan x="1860" dy="17">reviewee; COMMIT</tspan></text><line x1="1990" y1="4592" x2="1730" y2="4592" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="4582" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">25. Created review</tspan></text><line x1="1730" y1="4680" x2="1430" y2="4680" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="4670" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">26. Created review</tspan></text><line x1="1430" y1="4768" x2="1130" y2="4768" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="4758" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">27. Created review</tspan></text><path d="M1130 4977h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="4933" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">28. present(review): convert Decimal</tspan><tspan x="1265" dy="17">overallRating to number; hide</tspan><tspan x="1265" dy="17">soft-deleted response as null</tspan></text><line x1="1130" y1="5066" x2="850" y2="5066" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="5056" text-anchor="middle" font-size="13"><tspan x="990" dy="0">29. ReviewDto</tspan></text><line x1="850" y1="5154" x2="590" y2="5154" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="5144" text-anchor="middle" font-size="13"><tspan x="720" dy="0">30. Return controller result</tspan></text><line x1="590" y1="5242" x2="330" y2="5242" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="5232" text-anchor="middle" font-size="13"><tspan x="460" dy="0">31. 201 Created: ReviewDto</tspan></text><line x1="330" y1="5330" x2="90" y2="5330" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="5320" text-anchor="middle" font-size="13"><tspan x="210" dy="0">32. Display created review</tspan></text></g></svg>
