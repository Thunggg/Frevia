<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="3335" viewBox="0 0 2110 3335"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-30.02 — Mark Notification as Read</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Authenticated owner action • return arrows are dashed • break terminates the interaction</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Authenticated User</tspan></text><line x1="90" y1="280" x2="90" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:NotificationView</tspan></text><line x1="330" y1="225" x2="330" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="2903" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:NotificationRoute</tspan></text><line x1="590" y1="225" x2="590" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="2891" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:NotificationController</tspan></text><line x1="850" y1="225" x2="850" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="2879" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:NotificationService</tspan></text><line x1="1130" y1="225" x2="1130" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="2867" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:NotificationRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="2855" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="2843" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="3295" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="2831" fill="white" stroke="#111"/><rect x="35" y="540" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 568h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="559" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="562" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.1 Verify jwt</tspan></text><rect x="35" y="656" width="2040" height="226" fill="none" stroke="#111"/><path d="M35 684h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="675" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="678" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[invalid token / session / role permission]</tspan></text><rect x="35" y="918" width="2040" height="80" fill="none" stroke="#111"/><path d="M35 946h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="937" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="940" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">3.2. PermissionGuard: roleHasPermission(roleId, method, path)</tspan></text><rect x="35" y="1650" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1678h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1669" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1672" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[notification missing, deleted or belongs to another user]</tspan></text><rect x="35" y="2088" width="2040" height="724" fill="none" stroke="#111"/><path d="M35 2116h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2107" text-anchor="middle" font-size="13"><tspan x="68" dy="0">alt</tspan></text><text x="1090" y="2110" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[notification.isRead == true]</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Mark notification as read</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. PATCH /notifications/:id/read</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. markRead(userId, notificationId)</tspan></text><line x1="590" y1="734" x2="330" y2="734" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="724" text-anchor="middle" font-size="13"><tspan x="460" dy="0">3.1.1. 401 / 403 error response</tspan></text><line x1="330" y1="822" x2="90" y2="822" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="795" text-anchor="middle" font-size="13"><tspan x="210" dy="0">3.1.2. Display authentication /</tspan><tspan x="210" dy="17">permission error</tspan></text><line x1="850" y1="1058" x2="1130" y2="1058" stroke="#111"  marker-end="url(#call)"/><text x="990" y="1048" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. markRead(userId, notificationId)</tspan></text><line x1="1130" y1="1146" x2="1430" y2="1146" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="1136" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findById(userId, notificationId)</tspan></text><line x1="1430" y1="1234" x2="1730" y2="1234" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="1207" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. notification.findFirst(id, userId,</tspan><tspan x="1580" dy="17">deletedAt null)</tspan></text><line x1="1730" y1="1322" x2="1990" y2="1322" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="1295" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active notification owned</tspan><tspan x="1860" dy="17">by current user</tspan></text><line x1="1990" y1="1410" x2="1730" y2="1410" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="1400" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Notification or null</tspan></text><line x1="1730" y1="1498" x2="1430" y2="1498" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="1488" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Notification or null</tspan></text><line x1="1430" y1="1586" x2="1130" y2="1586" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1576" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Notification or null</tspan></text><line x1="1130" y1="1728" x2="850" y2="1728" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1718" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 NotificationNotFoundException</tspan></text><line x1="850" y1="1816" x2="590" y2="1816" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1806" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1904" x2="330" y2="1904" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1894" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1992" x2="90" y2="1992" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1982" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><path d="M1130 2166h55v32h-55" fill="none" stroke="#111" marker-end="url(#call)"/><text x="1265" y="2139" text-anchor="middle" font-size="13"><tspan x="1265" dy="0">12. Use existing notification; no</tspan><tspan x="1265" dy="17">update needed</tspan></text><line x1="1130" y1="2312" x2="1430" y2="2312" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="2302" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">13. markRead(notificationId)</tspan></text><line x1="1430" y1="2400" x2="1730" y2="2400" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="2390" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">14. notification.update(id; isRead true)</tspan></text><line x1="1730" y1="2488" x2="1990" y2="2488" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="2461" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">15. UPDATE Notification SET</tspan><tspan x="1860" dy="17">isRead=true</tspan></text><line x1="1990" y1="2576" x2="1730" y2="2576" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="2566" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">16. Updated notification</tspan></text><line x1="1730" y1="2664" x2="1430" y2="2664" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="2654" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">17. Updated notification</tspan></text><line x1="1430" y1="2752" x2="1130" y2="2752" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="2742" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">18. Updated notification</tspan></text><line x1="1130" y1="2872" x2="850" y2="2872" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="2862" text-anchor="middle" font-size="13"><tspan x="990" dy="0">19. NotificationDto</tspan></text><line x1="850" y1="2960" x2="590" y2="2960" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="2950" text-anchor="middle" font-size="13"><tspan x="720" dy="0">20. Return controller result</tspan></text><line x1="590" y1="3048" x2="330" y2="3048" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="3038" text-anchor="middle" font-size="13"><tspan x="460" dy="0">21. 200 OK: NotificationDto</tspan></text><line x1="330" y1="3136" x2="90" y2="3136" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3092" text-anchor="middle" font-size="13"><tspan x="210" dy="0">22. Invalidate notifications</tspan><tspan x="210" dy="17">query; refetch list and unread</tspan><tspan x="210" dy="17">state</tspan></text><line x1="35" y1="2242" x2="2075" y2="2242" stroke="#111" stroke-dasharray="7 5"/><text x="1055" y="2264" text-ancho