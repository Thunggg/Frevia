" y2="3888" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="3861" text-anchor="middle" font-size="13"><tspan x="210" dy="0">24. Display rating, breakdown,</tspan><tspan x="210" dy="17">comment and active response</tspan></text></g></svg>
