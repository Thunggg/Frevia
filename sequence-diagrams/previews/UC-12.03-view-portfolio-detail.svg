<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="2202" viewBox="0 0 2110 2202"><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#111"><text x="1055" y="65" text-anchor="middle" font-size="24"><tspan x="1055" dy="0">UC-12.03 — View Portfolio Detail</tspan></text><text x="1055" y="102" text-anchor="middle" font-size="13"><tspan x="1055" dy="0">Public endpoint (@IsPublic) • no JWT required • return arrows are dashed</tspan></text><circle cx="90" cy="169" r="11" fill="white" stroke="#111"/><path d="M90 180v30m-22-19h44m-22 19l-20 25m20-25l20 25" stroke="#111" fill="none"/><text x="90" y="253" text-anchor="middle" font-size="13"><tspan x="90" dy="0">Visitor / Freelancer</tspan></text><line x1="90" y1="280" x2="90" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="218" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="330" y="207" text-anchor="middle" font-size="13"><tspan x="330" dy="0">:PortfolioView</tspan></text><line x1="330" y1="225" x2="330" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="325" y="312" width="10" height="1770" fill="white" stroke="#111"/><rect x="478" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="590" y="207" text-anchor="middle" font-size="13"><tspan x="590" dy="0">:PortfolioRoute</tspan></text><line x1="590" y1="225" x2="590" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="585" y="324" width="10" height="1758" fill="white" stroke="#111"/><rect x="738" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="850" y="207" text-anchor="middle" font-size="13"><tspan x="850" dy="0">:PortfolioController</tspan></text><line x1="850" y1="225" x2="850" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="845" y="336" width="10" height="1746" fill="white" stroke="#111"/><rect x="1018" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1130" y="207" text-anchor="middle" font-size="13"><tspan x="1130" dy="0">:PortfolioService</tspan></text><line x1="1130" y1="225" x2="1130" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="1125" y="348" width="10" height="1734" fill="white" stroke="#111"/><rect x="1318" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1430" y="207" text-anchor="middle" font-size="13"><tspan x="1430" dy="0">:PortfolioRepository</tspan></text><line x1="1430" y1="225" x2="1430" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="1425" y="360" width="10" height="1722" fill="white" stroke="#111"/><rect x="1618" y="180" width="224" height="45" fill="white" stroke="#111"/><text x="1730" y="207" text-anchor="middle" font-size="13"><tspan x="1730" dy="0">:PrismaService</tspan></text><line x1="1730" y1="225" x2="1730" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="1725" y="372" width="10" height="1710" fill="white" stroke="#111"/><path d="M1960 165v50a30 10 0 0 0 60 0v-50" fill="white" stroke="#111" stroke-width="2"/><ellipse cx="1990" cy="165" rx="30" ry="10" fill="white" stroke="#111" stroke-width="2"/><text x="1990" y="247" text-anchor="middle" font-size="13"><tspan x="1990" dy="0">Database</tspan></text><line x1="1990" y1="260" x2="1990" y2="2162" stroke="#555" stroke-dasharray="7 5"/><rect x="1985" y="384" width="10" height="1698" fill="white" stroke="#111"/><rect x="35" y="1156" width="2040" height="402" fill="none" stroke="#111"/><path d="M35 1184h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1175" text-anchor="middle" font-size="13"><tspan x="68" dy="0">break</tspan></text><text x="1090" y="1178" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[portfolio not found or soft-deleted]</tspan></text><rect x="35" y="1946" width="2040" height="86" fill="none" stroke="#111"/><path d="M35 1974h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1965" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="1968" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">On non-HttpException in PortfolioService: 500 UnableToLoadPortfoliosException; existing HttpException is rethrown</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="273" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open portfolio card; display</tspan><tspan x="210" dy="17">cached card while loading detail</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /profiles/portfolios/:id</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. getPortfolioDetail(id)</tspan></text><line x1="850" y1="564" x2="1130" y2="564" stroke="#111"  marker-end="url(#call)"/><text x="990" y="554" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. getPortfolioDetail(id)</tspan></text><line x1="1130" y1="652" x2="1430" y2="652" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="642" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findPortfolioById(portfolioId)</tspan></text><line x1="1430" y1="740" x2="1730" y2="740" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="713" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. portfolioItem.findFirst(id; deletedAt</tspan><tspan x="1580" dy="17">null)</tspan></text><line x1="1730" y1="828" x2="1990" y2="828" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="818" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT active PortfolioItem by id</tspan></text><line x1="1990" y1="916" x2="1730" y2="916" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="906" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. PortfolioItem or null</tspan></text><line x1="1730" y1="1004" x2="1430" y2="1004" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="994" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. PortfolioItem or null</tspan></text><line x1="1430" y1="1092" x2="1130" y2="1092" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1082" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. PortfolioItem or null</tspan></text><line x1="1130" y1="1234" x2="850" y2="1234" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1224" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404 PortfolioNotFoundException</tspan></text><line x1="850" y1="1322" x2="590" y2="1322" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1312" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1410" x2="330" y2="1410" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1400" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1498" x2="90" y2="1498" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1488" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan></text><line x1="1130" y1="1618" x2="850" y2="1618" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1608" text-anchor="middle" font-size="13"><tspan x="990" dy="0">12. PortfolioItemResponseDto</tspan></text><line x1="850" y1="1706" x2="590" y2="1706" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1696" text-anchor="middle" font-size="13"><tspan x="720" dy="0">13. Return controller result</tspan></text><line x1="590" y1="1794" x2="330" y2="1794" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1784" text-anchor="middle" font-size="13"><tspan x="460" dy="0">14. 200 OK: PortfolioItemResponseDto</tspan></text><line x1="330" y1="1882" x2="90" y2="1882" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1855" text-anchor="middle" font-size="13"><tspan x="210" dy="0">15. Display title, description,</tspan><tspan x="210" dy="17">technologies and project link</tspan></text></g></svg>
