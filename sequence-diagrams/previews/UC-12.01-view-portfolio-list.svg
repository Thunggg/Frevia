span></text><rect x="35" y="1595" width="2040" height="579" fill="none" stroke="#111"/><path d="M35 1623h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="1614" text-anchor="middle" font-size="13"><tspan x="68" dy="0">opt</tspan></text><text x="1090" y="1617" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">[profile.freelancerProfile exists; otherwise return []]</tspan></text><rect x="35" y="2563" width="2040" height="86" fill="none" stroke="#111"/><path d="M35 2591h60l10-10v-18" fill="none" stroke="#111"/><text x="68" y="2582" text-anchor="middle" font-size="13"><tspan x="68" dy="0">ref</tspan></text><text x="1090" y="2585" text-anchor="middle" font-size="13"><tspan x="1090" dy="0">On non-HttpException in PortfolioService: 500 UnableToLoadPortfoliosException; existing HttpException is rethrown</tspan></text><line x1="90" y1="300" x2="330" y2="300" stroke="#111"  marker-end="url(#call)"/><text x="210" y="290" text-anchor="middle" font-size="13"><tspan x="210" dy="0">1. Open profile portfolio section</tspan></text><line x1="330" y1="388" x2="590" y2="388" stroke="#111"  marker-end="url(#call)"/><text x="460" y="378" text-anchor="middle" font-size="13"><tspan x="460" dy="0">2. GET /profiles/:id/portfolios</tspan></text><line x1="590" y1="476" x2="850" y2="476" stroke="#111"  marker-end="url(#call)"/><text x="720" y="466" text-anchor="middle" font-size="13"><tspan x="720" dy="0">3. getPortfolios(id)</tspan></text><line x1="850" y1="564" x2="1130" y2="564" stroke="#111"  marker-end="url(#call)"/><text x="990" y="554" text-anchor="middle" font-size="13"><tspan x="990" dy="0">4. getPortfolios(id)</tspan></text><line x1="1130" y1="652" x2="1430" y2="652" stroke="#111"  marker-end="url(#call)"/><text x="1280" y="642" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">5. findFreelancerProfileById(profileId)</tspan></text><line x1="1430" y1="740" x2="1730" y2="740" stroke="#111"  marker-end="url(#call)"/><text x="1580" y="730" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">6. profile.findFirst(id OR userId)</tspan></text><line x1="1730" y1="828" x2="1990" y2="828" stroke="#111"  marker-end="url(#call)"/><text x="1860" y="801" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">7. SELECT Profile + FreelancerProfile</tspan><tspan x="1860" dy="17">+ User roles; user.deletedAt IS NULL</tspan></text><line x1="1990" y1="917" x2="1730" y2="917" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1860" y="907" text-anchor="middle" font-size="13"><tspan x="1860" dy="0">8. Profile or null</tspan></text><line x1="1730" y1="1005" x2="1430" y2="1005" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1580" y="995" text-anchor="middle" font-size="13"><tspan x="1580" dy="0">9. Profile or null</tspan></text><line x1="1430" y1="1093" x2="1130" y2="1093" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1280" y="1083" text-anchor="middle" font-size="13"><tspan x="1280" dy="0">10. Profile or null</tspan></text><line x1="1130" y1="1235" x2="850" y2="1235" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="990" y="1208" text-anchor="middle" font-size="13"><tspan x="990" dy="0">11.1. 404</tspan><tspan x="990" dy="17">FreelancerProfileNotFoundException</tspan></text><line x1="850" y1="1323" x2="590" y2="1323" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="720" y="1313" text-anchor="middle" font-size="13"><tspan x="720" dy="0">11.2. Propagate HTTP error</tspan></text><line x1="590" y1="1411" x2="330" y2="1411" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="460" y="1401" text-anchor="middle" font-size="13"><tspan x="460" dy="0">11.3. Return error response</tspan></text><line x1="330" y1="1499" x2="90" y2="1499" stroke="#111" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="210" y="1489" text-anchor="middle" font-size="13"><tspan x="210" dy="0">11.4. Display error message</tspan